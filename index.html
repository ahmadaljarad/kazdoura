<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b55"><title>كزدورة</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial;background:#f7f3ea;color:#17231f}.top{background:#176b55;color:#fff;padding:22px 18px}.head{display:flex;justify-content:space-between}.brand{font-size:34px;font-weight:900}.langs{display:flex;gap:6px;direction:ltr}.langs button{border:0;border-radius:12px;padding:10px;background:#ffffff22;color:#fff;font-weight:800}.langs .active{background:#fff;color:#176b55}.view{display:none}.view.active{display:block}.hero,.city{padding:22px 16px}.hero h1,.city h1{margin:0 0 7px}.muted{color:#68736e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:0 14px 24px}.tile{border:0;background:#fff;border-radius:20px;padding:17px 14px;text-align:start;box-shadow:0 3px 14px #0001}.tile.on{background:#176b55;color:#fff}.tile strong{display:block;font-size:17px}.tile small{display:block;margin-top:5px;opacity:.7}.back{border:0;background:#e7f1ed;color:#176b55;border-radius:12px;padding:10px 13px;font-weight:800;margin-bottom:14px}.section{padding:5px 15px 12px}.section h2{margin:0}.foods{display:flex;gap:8px;overflow:auto;padding:0 14px 22px}.food{background:#fff;padding:12px 15px;border-radius:15px;white-space:nowrap}.cards{display:grid;gap:15px;padding:0 14px 25px}.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 4px 16px #0001}.photo{width:100%;height:210px;object-fit:cover;display:block;background:#e9e5db}.body{padding:15px}.body h3{margin:0 0 7px;font-size:21px}.body p{color:#56635e;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.chip{background:#f3efe6;border-radius:10px;padding:5px 8px;font-size:12px}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:#176b55;color:#fff}.secondary{background:#e8f1ee;color:#176b55}.credit{font-size:10px;color:#87918d;margin-top:8px}@media(min-width:800px){main{max-width:900px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="head"><div><div class="brand">كزدورة</div><div id="tag"></div></div><div class="langs"><button data-l="ar" class="active">ع</button><button data-l="de">DE</button><button data-l="en">EN</button></div></div></header><main><section id="home" class="view active"><div class="hero"><h1 id="homeTitle"></h1><div class="muted" id="homeDesc"></div></div><div class="grid" id="govGrid"></div></section><section id="damascus" class="view"><div class="city"><button class="back" id="homeBack"></button><h1 id="cityTitle"></h1><div class="muted" id="cityDesc"></div></div><div class="section"><h2 id="what"></h2></div><div class="grid" id="catGrid"></div><div class="section"><h2 id="taste"></h2></div><div class="foods" id="foodBox"></div></section><section id="list" class="view"><div class="city"><button class="back" id="cityBack"></button><h1 id="listTitle"></h1></div><div class="cards" id="cards"></div></section></main><script>
const tr={ar:{tag:'اكتشف سوريا بطريقتك',home:'وين بدك تكزدُر؟',desc:'اختار المحافظة وبعدها اكتشف شو فيها.',available:'متاحة الآن',soon:'قيد التجهيز',back:'رجوع',city:'دمشق',cityDesc:'اختار شو حابب تعمل بدمشق.',what:'شو بدك تعمل؟',taste:'شو لازم تذوق؟',route:'الاتجاهات',details:'التفاصيل',old:'دمشق القديمة',historic:'تاريخي',food:'مأكولات شامية',cats:{landmarks:'🏛️ معالم وآثار',restaurants:'🍽️ مطاعم',cafes:'☕ كافيهات وحلويات',markets:'🛍️ أسواق',parks:'🌳 حدائق',family:'👨‍👩‍👧 عائلات وأطفال',events:'🎉 فعاليات',hotels:'🏨 فنادق'}},de:{tag:'Entdecke Syrien auf deine Art',home:'Wohin möchtest du?',desc:'Wähle ein Gouvernement und entdecke es.',available:'Verfügbar',soon:'In Vorbereitung',back:'Zurück',city:'Damaskus',cityDesc:'Was möchtest du in Damaskus machen?',what:'Was möchtest du machen?',taste:'Was solltest du probieren?',route:'Route',details:'Details',old:'Altstadt',historic:'Historisch',food:'Syrische Küche',cats:{landmarks:'🏛️ Sehenswürdigkeiten',restaurants:'🍽️ Restaurants',cafes:'☕ Cafés & Süßes',markets:'🛍️ Märkte',parks:'🌳 Parks',family:'👨‍👩‍👧 Familie & Kinder',events:'🎉 Events',hotels:'🏨 Hotels'}},en:{tag:'Discover Syria your way',home:'Where do you want to explore?',desc:'Choose a governorate and discover it.',available:'Available',soon:'In preparation',back:'Back',city:'Damascus',cityDesc:'What would you like to do in Damascus?',what:'What do you want to do?',taste:'What should you taste?',route:'Directions',details:'Details',old:'Old Damascus',historic:'Historic',food:'Syrian cuisine',cats:{landmarks:'🏛️ Landmarks',restaurants:'🍽️ Restaurants',cafes:'☕ Cafés & sweets',markets:'🛍️ Markets',parks:'🌳 Parks',family:'👨‍👩‍👧 Family & kids',events:'🎉 Events',hotels:'🏨 Hotels'}}};
const govs=[['دمشق','Damaskus','Damascus','🏛️',true],['ريف دمشق','Rif Damaskus','Rif Dimashq','⛰️'],['حلب','Aleppo','Aleppo','🏰'],['حمص','Homs','Homs','🌿'],['حماة','Hama','Hama','💧'],['اللاذقية','Latakia','Latakia','🌊'],['طرطوس','Tartus','Tartus','⚓'],['إدلب','Idlib','Idlib','🌳'],['درعا','Daraa','Daraa','🌾'],['السويداء','As-Suwaida','As-Suwayda','⛰️'],['القنيطرة','Quneitra','Quneitra','🌄'],['دير الزور','Deir ez-Zor','Deir ez-Zor','🌴'],['الرقة','Raqqa','Raqqa','🏺'],['الحسكة','Al-Hasaka','Al-Hasakah','🌾']];
const imgs={mosque:'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Damascus%2C_Syria%2C_The_Umayyad_Mosque%2C_The_Great_Mosque_of_Damascus_2.jpg/1280px-Damascus%2C_Syria%2C_The_Umayyad_Mosque%2C_The_Great_Mosque_of_Damascus_2.jpg',azm:'https://upload.wikimedia.org/wikipedia/commons/0/0e/%D8%AF%D9%85%D8%B4%D9%82_%D8%A7%D9%84%D9%82%D8%AF%D9%8A%D9%85%D8%A9-%D9%82%D8%B5%D8%B1_%D8%A7%D9%84%D8%B9%D8%B8%D9%85_%2824%29.jpg',souq:'https://upload.wikimedia.org/wikipedia/commons/5/5a/Al-Hamidiyeh_souq%2C_Damascus%2C_Syria_-_2.jpg',khan:'https://upload.wikimedia.org/wikipedia/commons/b/b1/Damascus%2C_Syria%2C_Khan_As%27ad_Pasha_Roof.jpg',bakdash:'https://upload.wikimedia.org/wikipedia/commons/e/e4/Bakdash.JPG'};
const places={landmarks:[{n:['الجامع الأموي','Umayyaden-Moschee','Umayyad Mosque'],d:['من أبرز معالم دمشق القديمة، واكتمل بناؤه في العصر الأموي في أوائل القرن الثامن.','Eine der wichtigsten Sehenswürdigkeiten der Altstadt; der heutige Bau stammt aus der frühen Umayyadenzeit.','One of Old Damascus’s major landmarks; the present mosque dates to the early Umayyad period.'],img:imgs.mosque,lat:33.5115,lng:36.3066},{n:['قصر العظم','Azem-Palast','Azem Palace'],d:['قصر دمشقي من القرن الثامن عشر وتحول إلى متحف للفنون والتقاليد الشعبية.','Damascener Palast aus dem 18. Jahrhundert, heute Museum für Kunst und Volkstraditionen.','An 18th-century Damascene palace, now a museum of arts and popular traditions.'],img:imgs.azm,lat:33.5102,lng:36.3084},{n:['خان أسعد باشا','Khan As’ad Pasha','Khan As’ad Pasha'],d:['خان عثماني تاريخي في دمشق القديمة، معروف بقبابه وبنائه الحجري المميز.','Historische osmanische Karawanserei in der Altstadt mit markanten Kuppeln und Steinarchitektur.','A historic Ottoman caravanserai in the Old City, known for its domes and striped stone architecture.'],img:imgs.khan,lat:33.5088,lng:36.3096},{n:['المتحف الوطني بدمشق','Nationalmuseum Damaskus','National Museum of Damascus'],d:['المتحف الوطني الرئيسي في سوريا ويضم مجموعات أثرية من فترات تاريخية متعددة.','Syriens wichtigstes Nationalmuseum mit archäologischen Sammlungen aus vielen Epochen.','Syria’s principal national museum, with archaeological collections spanning many periods.'],lat:33.5137,lng:36.2906},{n:['الشارع المستقيم','Gerade Straße','Straight Street'],d:['محور تاريخي يعبر دمشق القديمة من الشرق إلى الغرب ويرجع تخطيطه إلى العصر الروماني.','Historische Ost-West-Achse der Altstadt, deren Anlage auf die Römerzeit zurückgeht.','A historic east-west axis through the Old City whose layout dates to Roman times.'],lat:33.5097,lng:36.3152},{n:['باب توما','Bab Touma','Bab Touma'],d:['بوابة وحي تاريخي في دمشق القديمة، معروف بالأزقة والكنائس والبيوت الدمشقية.','Historisches Tor und Viertel der Altstadt mit Gassen, Kirchen und traditionellen Häusern.','A historic gate and Old City quarter known for lanes, churches and Damascene houses.'],lat:33.5131,lng:36.3177}],restaurants:[{n:['مطعم نارنج','Naranj Restaurant','Naranj Restaurant'],d:['مطعم معروف في دمشق يقدم مأكولات سورية وشرق أوسطية.','Bekanntes Restaurant mit syrischer und orientalischer Küche.','A well-known Damascus restaurant serving Syrian and Middle Eastern cuisine.'],lat:33.5105,lng:36.3135},{n:['بيت جبري','Beit Jabri','Beit Jabri'],d:['بيت دمشقي تقليدي ومطعم في المدينة القديمة.','Traditionelles Damascener Haus und Restaurant in der Altstadt.','A traditional Damascene house and restaurant in the Old City.'],lat:33.5108,lng:36.3115}],cafes:[{n:['بكداش','Bakdash','Bakdash'],d:['من أشهر أماكن البوظة الدمشقية في سوق الحميدية.','Eine der bekanntesten Adressen für Damascener Eis im Souq al-Hamidiyah.','One of the best-known places for Damascene ice cream in Al-Hamidiyah Souq.'],img:imgs.bakdash,lat:33.5113,lng:36.3023},{n:['مقهى النوفرة','Al Nawforaa Café','Al Nawforaa Café'],d:['مقهى دمشقي تقليدي قرب الجامع الأموي في قلب المدينة القديمة.','Traditionelles Damascener Café nahe der Umayyaden-Moschee.','A traditional Damascene café near the Umayyad Mosque.'],lat:33.512,lng:36.3069}],markets:[{n:['سوق الحميدية','Souq al-Hamidiyah','Al-Hamidiyah Souq'],d:['أحد أشهر الأسواق التاريخية المغطاة في دمشق، ويمتد باتجاه الجامع الأموي.','Einer der bekanntesten überdachten historischen Basare von Damaskus, direkt in Richtung Umayyaden-Moschee.','One of Damascus’s best-known historic covered markets, leading toward the Umayyad Mosque.'],img:imgs.souq,lat:33.5111,lng:36.303}],parks:[],family:[],events:[],hotels:[]};
const food={ar:['🍦 بوظة دمشقية','🥙 فتة','🍆 مكدوس','🍬 حلويات شامية'],de:['🍦 Damascener Eis','🥙 Fatteh','🍆 Makdous','🍬 Damascener Süßes'],en:['🍦 Damascene ice cream','🥙 Fatteh','🍆 Makdous','🍬 Damascene sweets']};let lang='ar',current='';function li(){return lang==='ar'?0:lang==='de'?1:2}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}function renderHome(){let t=tr[lang];tag.textContent=t.tag;homeTitle.textContent=t.home;homeDesc.textContent=t.desc;govGrid.innerHTML='';govs.forEach((g,i)=>{let b=document.createElement('button');b.className='tile'+(i===0?' on':'');b.innerHTML='<strong>'+g[3]+' '+g[li()]+'</strong><small>'+(i===0?t.available:t.soon)+'</small>';b.onclick=()=>i===0?(renderCity(),show('damascus')):alert(t.soon);govGrid.appendChild(b)})}function renderCity(){let t=tr[lang];homeBack.textContent='← '+t.back;cityTitle.textContent='🏛️ '+t.city;cityDesc.textContent=t.cityDesc;what.textContent=t.what;taste.textContent=t.taste;catGrid.innerHTML='';Object.keys(t.cats).forEach(k=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<strong>'+t.cats[k]+'</strong><small>'+(places[k].length?t.available:t.soon)+'</small>';b.onclick=()=>openList(k);catGrid.appendChild(b)});foodBox.innerHTML='';food[lang].forEach(x=>{let d=document.createElement('div');d.className='food';d.textContent=x;foodBox.appendChild(d)})}function openList(k){if(!places[k].length)return alert(tr[lang].soon);current=k;listTitle.textContent=tr[lang].cats[k];cityBack.textContent='← '+tr[lang].back;cards.innerHTML='';places[k].forEach(p=>{let a=document.createElement('article');a.className='card';a.innerHTML=(p.img?'<img class="photo" src="'+p.img+'" alt="'+p.n[li()]+'" loading="lazy" onerror="this.style.display=\'none\'">':'')+'<div class="body"><h3>'+p.n[li()]+'</h3><div class="chips"><span class="chip">📍 '+tr[lang].old+'</span><span class="chip">✨ '+(k==='restaurants'||k==='cafes'?tr[lang].food:tr[lang].historic)+'</span></div><p>'+p.d[li()]+'</p><div class="actions"><button class="primary">'+tr[lang].route+'</button><button class="secondary">'+tr[lang].details+'</button></div>'+(p.img?'<div class="credit">📷 Wikimedia Commons</div>':'')+'</div>';a.querySelector('.primary').onclick=()=>window.open('https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=17/'+p.lat+'/'+p.lng,'_blank');a.querySelector('.secondary').onclick=()=>alert(p.n[li()]+'\n\n'+p.d[li()]);cards.appendChild(a)});show('list')}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x===b));renderHome();if(damascus.classList.contains('active'))renderCity();if(list.classList.contains('active')&&current)openList(current)});homeBack.onclick=()=>show('home');cityBack.onclick=()=>show('damascus');renderHome();
</script></body></html>

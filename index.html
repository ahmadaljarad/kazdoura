<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#176b55" />
  <title>كزدورة | اكتشف سوريا</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f6f3ec;color:#17231f}.top{padding:18px 16px 14px;background:#176b55;color:white;position:relative}.brand{font-size:30px;font-weight:900}.tag{opacity:.9;margin-top:2px}.langs{position:absolute;top:18px;left:14px;display:flex;gap:5px}.langs button{border:0;border-radius:12px;padding:7px 9px;background:#ffffff22;color:white;font-weight:700}.langs button.active{background:white;color:#176b55}.search{padding:14px 14px 8px}.search input{width:100%;padding:14px 16px;border:1px solid #ddd5c7;border-radius:16px;font-size:16px;background:white}.cats{display:flex;gap:8px;overflow:auto;padding:4px 14px 12px}.cats button{white-space:nowrap;border:1px solid #d7d0c2;background:white;padding:10px 12px;border-radius:18px}.cats button.active{background:#176b55;color:white;border-color:#176b55}#map{height:47vh;min-height:330px}.panel{padding:14px}.panel h2{margin:0 0 10px;font-size:20px}.cards{display:grid;gap:10px}.card{background:white;border-radius:18px;padding:14px;box-shadow:0 4px 18px #0000000d}.card h3{margin:0 0 5px}.meta{font-size:13px;color:#68726d}.actions{display:flex;gap:8px;margin-top:11px}.actions button,.tour{border:0;border-radius:13px;padding:10px 12px;font-weight:700}.go{background:#176b55;color:white}.loc{background:#e9f2ef;color:#176b55}.tour{position:fixed;z-index:900;bottom:18px;left:50%;transform:translateX(-50%);background:#d79b36;color:#1e1b13;padding:13px 20px;box-shadow:0 5px 18px #0003}.leaflet-control-attribution{font-size:9px}.notice{font-size:12px;color:#68726d;margin-top:8px}@media(min-width:800px){main{max-width:1000px;margin:auto}.top{padding-inline:calc((100% - 970px)/2)}}
  </style>
</head>
<body>
<header class="top"><div class="brand">كزدورة</div><div class="tag" id="tag">اكتشف سوريا بطريقتك</div><div class="langs"><button data-l="en">EN</button><button data-l="de">DE</button><button class="active" data-l="ar">ع</button></div></header>
<main>
  <div class="search"><input id="search" placeholder="ابحث عن مكان أو مدينة…" /></div>
  <div class="cats" id="cats"></div>
  <div id="map"></div>
  <section class="panel"><h2 id="nearTitle">أماكن مقترحة في دمشق</h2><div class="cards" id="cards"></div><div class="notice" id="notice">نسخة تجريبية أولى. معلومات الأماكن ستُوسّع وتُراجع من مصادر موثوقة.</div></section>
</main>
<button class="tour" id="tour">✨ اعمللي كزدورة</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const T={
 ar:{tag:'اكتشف سوريا بطريقتك',search:'ابحث عن مكان أو مدينة…',near:'أماكن مقترحة في دمشق',tour:'✨ اعمللي كزدورة',go:'الاتجاهات',loc:'موقعي',notice:'نسخة تجريبية أولى. معلومات الأماكن ستُوسّع وتُراجع من مصادر موثوقة.',cats:['الكل','معالم','مطاعم','كافيهات','أطفال','حدائق','فنادق','أسواق']},
 de:{tag:'Entdecke Syrien auf deine Art',search:'Ort oder Stadt suchen…',near:'Empfohlene Orte in Damaskus',tour:'✨ Plane meine Kazdoura',go:'Route',loc:'Mein Standort',notice:'Erste Testversion. Ortsinformationen werden mit verlässlichen Quellen erweitert und geprüft.',cats:['Alle','Sehenswürdigkeiten','Restaurants','Cafés','Kinder','Parks','Hotels','Märkte']},
 en:{tag:'Discover Syria your way',search:'Search for a place or city…',near:'Recommended places in Damascus',tour:'✨ Plan my Kazdoura',go:'Directions',loc:'My location',notice:'Early test version. Place information will be expanded and verified with reliable sources.',cats:['All','Landmarks','Restaurants','Cafés','Kids','Parks','Hotels','Markets']}
};
const places=[
 {cat:1,lat:33.5115,lng:36.3066,ar:'الجامع الأموي',de:'Umayyaden-Moschee',en:'Umayyad Mosque'},
 {cat:7,lat:33.5111,lng:36.3030,ar:'سوق الحميدية',de:'Souq al-Hamidiyah',en:'Al-Hamidiyah Souq'},
 {cat:1,lat:33.5102,lng:36.3084,ar:'قصر العظم',de:'Azem-Palast',en:'Azem Palace'},
 {cat:5,lat:33.5150,lng:36.2920,ar:'حديقة تشرين',de:'Tishreen-Park',en:'Tishreen Park'}
];
let lang='ar',cat=0; const map=L.map('map').setView([33.513,36.305],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let layer=L.layerGroup().addTo(map);
function render(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('tag').textContent=t.tag;document.getElementById('search').placeholder=t.search;document.getElementById('nearTitle').textContent=t.near;document.getElementById('tour').textContent=t.tour;document.getElementById('notice').textContent=t.notice;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));const c=document.getElementById('cats');c.innerHTML='';t.cats.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.className=i===cat?'active':'';b.onclick=()=>{cat=i;render()};c.appendChild(b)});layer.clearLayers();const cards=document.getElementById('cards');cards.innerHTML='';places.filter(p=>!cat||p.cat===cat).forEach(p=>{L.marker([p.lat,p.lng]).addTo(layer).bindPopup('<b>'+p[lang]+'</b>');let d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+p[lang]+'</h3><div class="meta">Damascus · دمشق</div><div class="actions"><button class="go">'+t.go+'</button><button class="loc">'+t.loc+'</button></div>';d.querySelector('.go').onclick=()=>{window.open('https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=;'+p.lat+'%2C'+p.lng,'_blank')};d.querySelector('.loc').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(x=>{L.marker([x.coords.latitude,x.coords.longitude]).addTo(layer).bindPopup(t.loc).openPopup();map.setView([x.coords.latitude,x.coords.longitude],15)});cards.appendChild(d)})}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q)return;const p=places.find(x=>[x.ar,x.de,x.en].some(n=>n.toLowerCase().includes(q)));if(p)map.setView([p.lat,p.lng],16)});document.getElementById('tour').onclick=()=>alert(lang==='ar'?'قريباً: اختر وقتك واهتماماتك وسنبني لك كزدورة كاملة.':lang==='de'?'Demnächst: Wähle Zeit und Interessen und wir planen deine Tour.':'Coming soon: choose your time and interests and we will build your tour.');render();
</script>
</body>
</html>

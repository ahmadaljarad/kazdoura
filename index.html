const food={ar:['🍦 بوظة دمشقية','🥙 فتة','🍆 مكدوس','🍬 حلويات شامية'],de:['🍦 Damascener Eis','🥙 Fatteh','🍆 Makdous','🍬 Damascener Süßes'],en:['🍦 Damascene ice cream','🥙 Fatteh','🍆 Makdous','🍬 Damascene sweets']};let lang='ar',current='';const $=id=>document.getElementById(id),li=()=>lang==='ar'?0:lang==='de'?1:2;function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function home(){let t=T[lang];$('tag').textContent=t.tag;$('homeTitle').textContent=t.home;$('homeDesc').textContent=t.desc;$('govGrid').innerHTML='';govs.forEach((g,i)=>{let b=document.createElement('button');b.className='tile'+(i?'':' on');b.innerHTML='<strong>'+g[3]+' '+g[li()]+'</strong><small>'+(i?t.soon:t.ok)+'</small>';b.onclick=()=>i?alert(t.soon):(city(),show('damascus'));$('govGrid').appendChild(b)})}function city(){let t=T[lang];$('homeBack').textContent='← '+t.back;$('cityTitle').textContent='🏛️ '+t.city;$('cityDesc').textContent=t.cityDesc;$('what').textContent=t.what;$('taste').textContent=t.taste;$('catGrid').innerHTML='';Object.keys(t.cats).forEach(k=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<strong>'+t.cats[k]+'</strong><small>'+(places[k].length?(t.ok+' · '+places[k].length):t.soon)+'</small>';b.onclick=()=>openList(k);$('catGrid').appendChild(b)});$('foodBox').innerHTML=food[lang].map(x=>'<div class="food">'+x+'</div>').join('')}function thumb(x){try{let u=new URL(x);u.searchParams.set('width',520);return u}catch{return x}}function gallery(p){if(!p.imgs?.length)return '<div class="noimg">📷 '+T[lang].noPhoto+'</div>';return '<div class="gallery">'+p.imgs.map((x,i)=>'<img '+(i?'data-src':'src')+'="'+thumb(x)+'" loading="lazy" decoding="async" alt="'+p.n[li()]+'">').join('')+'</div>'}function card(p,k){let a=document.createElement('article');a.className='card';let eb=k==='events'?'<span class="typebadge">'+eventTypeLabel(p.type)+'</span>'+(p.start?'<span class="typebadge">📅 '+p.start+(p.end&&p.end!==p.start?' → '+p.end:'')+'</span>':''):'';let fb=k==='family'?'<span class="typebadge">'+(familyType(p)==='water'?'🏊 '+(lang==='ar'?'مسبح ومائي':lang==='de'?'Schwimmen & Wasser':'Pool & water'):'🎮 '+(lang==='ar'?'ألعاب وترفيه':lang==='de'?'Spiel & Freizeit':'Play & entertainment'))+'</span>':'';a.innerHTML=gallery(p)+'<div class="body">'+eb+fb+'<h3>'+p.n[li()]+'</h3><div class="chips"><span class="chip">📍 '+T[lang].city+'</span><span class="chip">✨ '+(k==='parks'?T[lang].park:k==='restaurants'||k==='cafes'?T[lang].food:T[lang].place)+'</span>'+(p.imgs?.length>1?'<span class="chip">📷 '+p.imgs.length+'</span>':'')+'</div><p>'+p.d[li()]+'</p><div class="actions"><button class="primary">'+T[lang].route+'</button><button class="secondary">'+T[lang].details+'</button></div>'+(p.imgs?'<div class="credit">📷 Wikimedia Commons · '+T[lang].photos+'</div>':'')+'</div>';let g=a.querySelector('.gallery'),load=()=>g?.querySelectorAll('[data-src]').forEach(i=>{i.src=i.dataset.src;i.removeAttribute('data-src')});g?.addEventListener('pointerdown',load,{once:true});g?.addEventListener('touchstart',load,{once:true,passive:true});a.querySelector('.primary').onclick=()=>window.open('https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=17/'+p.lat+'/'+p.lng,'_blank');a.querySelector('.secondary').onclick=()=>openDetail(p,k);$('cards').appendChild(a)}function openDetail(p,k){current=k;let imgs=p.imgs?.length?'<div class="gallery">'+p.imgs.map(x=>'<img src="'+thumb(x)+'" loading="lazy" decoding="async" alt="'+p.n[li()]+'">').join('')+'</div>':'<div class="noimg">📷 '+T[lang].noPhoto+'</div>';$('detailBack').textContent='← '+T[lang].back;$('detailContent').innerHTML=imgs+'<div class="body"><h1>'+p.n[li()]+'</h1><div class="chips"><span class="chip">📍 '+T[lang].city+'</span><span class="chip">✨ '+T[lang].cats[k]+'</span></div><p>'+p.d[li()]+'</p><div class="actions"><button class="primary" id="detailRoute">'+T[lang].route+'</button></div></div>';$('detailRoute').onclick=()=>window.open('https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=17/'+p.lat+'/'+p.lng,'_blank');show('detail')}function familyType(p){let n=(p.n||[]).join(' ').toLowerCase();return /مسبح|مائية|pool|water|schwimm/.test(n)?'water':'play'}function renderFamilyFilter(type){let arr=places.family.filter(p=>type==='all'||familyType(p)===type);$('cards').innerHTML='';arr.forEach(p=>card(p,'family'));$('listTitle').textContent=T[lang].cats.family+' · '+arr.length;document.querySelectorAll('#subFilters button').forEach(b=>b.classList.toggle('active',b.dataset.f===type))}function eventTypeLabel(t){
 const m={

 };

}
function renderEventFilter(type){
 let box=$('subFilters'),today=new Date().toISOString().slice(0,10);
 let arr=places.events.filter(e=>(!e.end||e.end>=today)&&(type==='all'||e.type===type)).sort((a,b)=>(a.start||'').localeCompare(b.start||''));

 let types=['all',...new Set(places.events.map(e=>e.type).filter(Boolean))];

 renderEventFilter('all');
}
function familyFilters(){let labels=lang==='ar'?[['all','الكل'],['play','🎮 ألعاب وترفيه'],['water','🏊 مسابح ومائي']]:lang==='de'?[['all','Alle'],['play','🎮 Spiel & Freizeit'],['water','🏊 Schwimmen & Wasser']]:[['all','All'],['play','🎮 Play & entertainment'],['water','🏊 Pools & water']];$('subFilters').style.display='flex';$('subFilters').innerHTML=labels.map(x=>'<button class="filterbtn" data-f="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('#subFilters button').forEach(b=>b.onclick=()=>renderFamilyFilter(b.dataset.f));renderFamilyFilter('all')}function openList(k){if(k==='events'){let today=new Date().toISOString().slice(0,10);places.events=places.events.filter(e=>!e.end||e.end>=today).sort((a,b)=>(a.start||'').localeCompare(b.start||''))}if(!places[k].length)return alert(T[lang].soon);current=k;$('listTitle').textContent=T[lang].cats[k]+' · '+places[k].length;$('cityBack').textContent='← '+T[lang].back;$('cards').innerHTML='';$('subFilters').style.display='none';$('subFilters').innerHTML='';if(k==='family')familyFilters();else if(k==='events')eventFilters();else places[k].forEach(p=>card(p,k));show('list')}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x===b));home();if($('damascus').classList.contains('active'))city();if($('list').classList.contains('active')&&current)openList(current)});$('homeBack').onclick=()=>show('home');$('cityBack').onclick=()=>show('damascus');$('detailBack').onclick=()=>openList(current);home();
</script></body></html>

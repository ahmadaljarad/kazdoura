='de'?g[2]:g[3]}function renderHome(){let t=T[lang];tag.textContent=t.tag;homeTitle.textContent=t.home;homeDesc.textContent=t.homeD;govs.innerHTML='';govsData.forEach(g=>{let b=document.createElement('button');b.className='gov '+(g[0]==='damascus'?'featured':'');b.innerHTML='<strong>'+g[4]+' '+gname(g)+'</strong><span>'+(g[0]==='damascus'?t.ready:t.soon)+'</span>';b.onclick=()=>g[0]==='damascus'?(renderGov(),show('governorate')):alert(t.soon);govs.appendChild(b)})}function renderGov(){let t=T[lang];govTitle.textContent='🏛️ '+(lang==='ar'?'دمشق':lang==='de'?'Damaskus':'Damascus');govDesc.textContent=t.govD;backHome.textContent='← '+t.back;whatTitle.textContent=t.what;foodTitle.textContent=t.food;eventNote.textContent=t.event;choices.innerHTML='';Object.entries(t.cats).forEach(([k,v])=>{let b=document.createElement('button');b.className='choice'+(places[k].length?'':' disabled');b.innerHTML='<span class="ico">'+v[0]+'</span><strong>'+v[1]+'</strong>';b.onclick=()=>openList(k,v[1]);choices.appendChild(b)});foods.innerHTML='';foodsData=foods[lang];foodsData.forEach(x=>{let d=document.createElement('div');d.className='food';d.textContent=x;foods.appendChild(d)})}function openList(k,title){if(!places[k].length)return alert(T[lang].soon);cat=k;listTitle.textContent=title;backGov.textContent='← '+T[lang].back;cards.innerHTML='';places[k].forEach(p=>{let d=document.createElement('article');d.className='card';let image=p[9]?'<img class="photo" loading="lazy" src="'+p[9]+'" alt="'+p[ni()]+'">':'';d.innerHTML=image+'<div class="cardbody"><h3>'+p[0]+' '+p[ni()]+'</h3><p>'+p[di()]+'</p><div class="actions"><button class="primary">'+T[lang].route+'</button><button class="secondary">'+T[lang].details+'</button></div>'+(p[10]?'<div class="credit">📷 '+p[10]+'</div>':'')+'</div>';d.querySelector('.primary').onclick=()=>openRoute(p);d.querySelector('.secondary').onclick=()=>alert(p[ni()]+'\n\n'+p[di()]);cards.appendChild(d)});show('listing')}function openRoute(p){selected=p;let t=T[lang];routeTitle.textContent=p[0]+' '+p[ni()];routeSub.textContent=t.from+' '+p[ni()];backList.textContent='← '+t.back;carTxt.textContent=t.car;walkTxt.textContent=t.walk;bikeTxt.textContent=t.bike;busTxt.textContent=t.bus;routeInfoTitle.textContent=t.route;routeInfoText.textContent=t.gps;show('route');setTimeout(initMap,100)}function initMap(){if(map){map.remove();map=null}map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[selected[8],selected[7]],zoom:15});new maplibregl.Marker().setLngLat([selected[8],selected[7]]).addTo(map);map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');navigator.geolocation&&navigator.geolocation.getCurrentPosition(pos=>{new maplibregl.Marker({color:'#d79b36'}).setLngLat([pos.coords.longitude,pos.coords.latitude]).addTo(map);let b=new maplibregl.LngLatBounds();b.extend([selected[8],selected[7]]).extend([pos.coords.longitude,pos.coords.latitude]);map.fitBounds(b,{padding:55,maxZoom:15})},()=>{})}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x===b));renderHome();if(governorate.classList.contains('active'))renderGov();if(listing.classList.contains('active'))openList(cat,T[lang].cats[cat][1])});backHome.onclick=()=>show('home');backGov.onclick=()=>show('governorate');backList.onclick=()=>show('listing');renderHome();</script></body></html>

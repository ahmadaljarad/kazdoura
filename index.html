<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b55"><title>كزدورة | اكتشف سوريا</title><link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial;background:#f6f3ec;color:#17231f}.top{padding:18px;background:#176b55;color:#fff}.headrow{display:flex;justify-content:space-between;gap:12px}.brand{font-size:30px;font-weight:900;line-height:1}.tag{opacity:.9;margin-top:8px}.langs{display:flex;gap:5px;direction:ltr}.langs button,.mapstyles button{border:0;border-radius:12px;padding:8px 10px;font-weight:700}.langs button{background:#ffffff20;color:#fff;min-width:42px}.langs button.active{background:#fff;color:#176b55}.search{padding:14px 14px 8px}.search input{width:100%;padding:14px 16px;border:1px solid #ddd5c7;border-radius:16px;font-size:16px}.cats{display:flex;gap:8px;overflow:auto;padding:4px 14px 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cats button{white-space:nowrap;border:1px solid #d7d0c2;background:#fff;padding:10px 12px;border-radius:18px}.cats button.active{background:#176b55;color:#fff;border-color:#176b55}.mapwrap{position:relative}#map{height:50vh;min-height:370px}.mapstyles{position:absolute;z-index:5;top:12px;right:12px;background:#fff;padding:5px;border-radius:15px;box-shadow:0 3px 14px #0003;display:flex;gap:4px;direction:ltr}.mapstyles button{background:#f1eee7;font-size:12px}.mapstyles button.active{background:#176b55;color:#fff}.place-marker{width:42px;height:42px;border-radius:50% 50% 50% 9px;transform:rotate(-45deg);background:#176b55;border:3px solid white;box-shadow:0 2px 8px #0005;display:grid;place-items:center;cursor:pointer}.place-marker span{transform:rotate(45deg);font-size:19px}.maplibregl-popup-content{border-radius:14px;padding:10px 13px;font-weight:800}.panel{padding:14px 14px 90px}.panel h2{margin:0 0 10px}.cards{display:grid;gap:10px}.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 18px #0000000d}.card h3{margin:0 0 5px}.meta{font-size:13px;color:#68726d}.actions{display:flex;gap:8px;margin-top:11px}.actions button,.tour{border:0;border-radius:13px;padding:10px 12px;font-weight:700}.go{background:#176b55;color:#fff}.loc{background:#e9f2ef;color:#176b55}.tour{position:fixed;z-index:9;bottom:18px;left:50%;transform:translateX(-50%);background:#d79b36;color:#1e1b13;padding:13px 20px;box-shadow:0 5px 18px #0003;white-space:nowrap}.notice{font-size:12px;color:#68726d;margin-top:8px}@media(max-width:390px){.brand{font-size:27px}.langs button{min-width:37px;padding:7px}.tag{font-size:14px}}</style></head><body><header class="top"><div class="headrow"><div><div class="brand">كزدورة</div><div class="tag" id="tag"></div></div><div class="langs"><button data-l="ar" class="active">ع</button><button data-l="de">DE</button><button data-l="en">EN</button></div></div></header><main><div class="search"><input id="search"></div><div class="cats" id="cats"></div><div class="mapwrap"><div id="map"></div><div class="mapstyles"><button class="active" data-style="liberty">🗺️ <span id="streetTxt"></span></button><button data-style="positron">✨ <span id="cleanTxt"></span></button></div></div><section class="panel"><h2 id="nearTitle"></h2><div class="cards" id="cards"></div><div class="notice" id="notice"></div></section></main><button class="tour" id="tour"></button><script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script>
const T={ar:{tag:'اكتشف سوريا بطريقتك',search:'ابحث عن مكان أو مدينة…',near:'أماكن مقترحة في دمشق',tour:'✨ اعمللي كزدورة',go:'الاتجاهات',loc:'موقعي',street:'خريطة',clean:'هادئة',city:'دمشق',notice:'نسخة تجريبية. معلومات الأماكن ستُراجع من مصادر موثوقة.',cats:['الكل','معالم','مطاعم','كافيهات','أطفال','حدائق','فنادق','أسواق']},de:{tag:'Entdecke Syrien auf deine Art',search:'Ort oder Stadt suchen…',near:'Empfohlene Orte in Damaskus',tour:'✨ Plane meine Kazdoura',go:'Route',loc:'Mein Standort',street:'Karte',clean:'Hell',city:'Damaskus',notice:'Testversion. Ortsinformationen werden aus verlässlichen Quellen geprüft.',cats:['Alle','Sehenswürdigkeiten','Restaurants','Cafés','Kinder','Parks','Hotels','Märkte']},en:{tag:'Discover Syria your way',search:'Search for a place or city…',near:'Recommended places in Damascus',tour:'✨ Plan my Kazdoura',go:'Directions',loc:'My location',street:'Map',clean:'Light',city:'Damascus',notice:'Test version. Place information will be verified using reliable sources.',cats:['All','Landmarks','Restaurants','Cafés','Kids','Parks','Hotels','Markets']}};
const places=[{cat:1,icon:'🏛️',lat:33.5115,lng:36.3066,ar:'الجامع الأموي',de:'Umayyaden-Moschee',en:'Umayyad Mosque'},{cat:7,icon:'🛍️',lat:33.5111,lng:36.3030,ar:'سوق الحميدية',de:'Souq al-Hamidiyah',en:'Al-Hamidiyah Souq'},{cat:1,icon:'🏛️',lat:33.5102,lng:36.3084,ar:'قصر العظم',de:'Azem-Palast',en:'Azem Palace'},{cat:5,icon:'🌳',lat:33.515,lng:36.292,ar:'حديقة تشرين',de:'Tishreen-Park',en:'Tishreen Park'}];
let lang='ar',cat=0,currentStyle='liberty',markers=[];const styleUrl=n=>'https://tiles.openfreemap.org/styles/'+n;const map=new maplibregl.Map({container:'map',style:styleUrl('liberty'),center:[36.305,33.513],zoom:13.7,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
function localizeMap(){if(!map.isStyleLoaded())return;const layers=map.getStyle().layers||[];layers.forEach(l=>{if(l.type!=='symbol'||!l.layout||!l.layout['text-field'])return;const id=l.id.toLowerCase();if(!(id.includes('label')||id.includes('place')||id.includes('road')||id.includes('poi')))return;try{const key=lang==='ar'?'name:ar':lang==='de'?'name:de':'name:en';map.setLayoutProperty(l.id,'text-field',['coalesce',['get',key],['get','name:latin'],['get','name']]);}catch(e){}})}
function clearMarkers(){markers.forEach(m=>m.remove());markers=[]}function renderMarkers(){clearMarkers();places.filter(p=>!cat||p.cat===cat).forEach(p=>{const el=document.createElement('div');el.className='place-marker';el.innerHTML='<span>'+p.icon+'</span>';const popup=new maplibregl.Popup({offset:30,closeButton:false}).setHTML('<div dir="'+(lang==='ar'?'rtl':'ltr')+'">'+p[lang]+'</div>');const m=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).setPopup(popup).addTo(map);markers.push(m)})}
function render(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';tag.textContent=t.tag;search.placeholder=t.search;nearTitle.textContent=t.near;tour.textContent=t.tour;notice.textContent=t.notice;streetTxt.textContent=t.street;cleanTxt.textContent=t.clean;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));cats.innerHTML='';t.cats.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i===cat?'active':'';b.onclick=()=>{cat=i;render()};cats.appendChild(b)});cards.innerHTML='';places.filter(p=>!cat||p.cat===cat).forEach(p=>{const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+p.icon+' '+p[lang]+'</h3><div class="meta">'+t.city+'</div><div class="actions"><button class="go">'+t.go+'</button><button class="loc">'+t.loc+'</button></div>';d.querySelector('.go').onclick=()=>window.open('https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=;'+p.lat+'%2C'+p.lng,'_blank');d.querySelector('.loc').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(x=>map.flyTo({center:[x.coords.longitude,x.coords.latitude],zoom:15}));cards.appendChild(d)});renderMarkers();localizeMap()}
map.on('load',()=>{render();localizeMap()});map.on('style.load',()=>{renderMarkers();setTimeout(localizeMap,150)});document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});document.querySelectorAll('.mapstyles button').forEach(b=>b.onclick=()=>{currentStyle=b.dataset.style;map.setStyle(styleUrl(currentStyle));document.querySelectorAll('.mapstyles button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});search.addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q)return;const p=places.find(x=>[x.ar,x.de,x.en].some(n=>n.toLowerCase().includes(q)));if(p)map.flyTo({center:[p.lng,p.lat],zoom:16})});tour.onclick=()=>alert(lang==='ar'?'قريباً: اختر وقتك واهتماماتك وسنبني لك كزدورة كاملة.':lang==='de'?'Demnächst: Wähle Zeit und Interessen und wir planen deine Tour.':'Coming soon: choose your time and interests and we will build your tour.');
</script></body></html>

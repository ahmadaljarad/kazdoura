const T={ar:{tag:'اكتشف سوريا بطريقتك',search:'ابحث عن مكان…',near:'اكتشف دمشق',tourTitle:'✨ اعمللي كزدورة',tourDesc:'اختر وقتك واهتماماتك وسنبني لك جولة مناسبة.',tour:'ابدأ التخطيط',go:'الاتجاهات',show:'على الخريطة',street:'خريطة',clean:'هادئة',city:'دمشق',hours:'تحقق من أوقات الزيارة',free:'دخول/زيارة',notice:'معلومات الزيارة المتغيرة مثل الأسعار والأوقات يجب تأكيدها في يوم الزيارة.',cats:['الكل','معالم','أسواق','متاحف','حدائق']},de:{tag:'Entdecke Syrien auf deine Art',search:'Ort suchen…',near:'Damaskus entdecken',tourTitle:'✨ Plane meine Kazdoura',tourDesc:'Wähle Zeit und Interessen und wir erstellen eine passende Tour.',tour:'Tour planen',go:'Route',show:'Auf Karte',street:'Karte',clean:'Hell',city:'Damaskus',hours:'Öffnungszeiten prüfen',free:'Besuch',notice:'Variable Angaben wie Preise und Öffnungszeiten bitte am Besuchstag bestätigen.',cats:['Alle','Sehenswürdigkeiten','Märkte','Museen','Parks']},en:{tag:'Discover Syria your way',search:'Search for a place…',near:'Discover Damascus',tourTitle:'✨ Plan my Kazdoura',tourDesc:'Choose your time and interests and we will build a suitable tour.',tour:'Plan a tour',go:'Directions',show:'Show on map',street:'Map',clean:'Light',city:'Damascus',hours:'Check visiting hours',free:'Visit',notice:'Variable details such as prices and opening hours should be confirmed on the day of visit.',cats:['All','Landmarks','Markets','Museums','Parks']}};

let lang='ar',cat=0,markers=[];const styleUrl=n=>'https://tiles.openfreemap.org/styles/'+n;const map=new maplibregl.Map({container:'map',style:styleUrl('liberty'),center:[36.302,33.512],zoom:14,attributionControl:false});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');
function localizeMap(){if(!map.isStyleLoaded())return;(map.getStyle().layers||[]).forEach(l=>{if(l.type!=='symbol'||!l.layout||!l.layout['text-field'])return;try{const key=lang==='de'?'name:de':'name:en';map.setLayoutProperty(l.id,'text-field',['coalesce',['get',key],['get','name:en'],['get','name:latin'],['get','name']])}catch(e){}})}function clearMarkers(){markers.forEach(m=>m.remove());markers=[]}function marker(p){const el=document.createElement('div');el.className='place-marker';el.innerHTML='<span>'+p.icon+'</span>';const pop=new maplibregl.Popup({offset:30,closeButton:false}).setHTML('<b dir="'+(lang==='ar'?'rtl':'ltr')+'">'+p[lang]+'</b>');markers.push(new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).setPopup(pop).addTo(map))}
function render(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';tag.textContent=t.tag;search.placeholder=t.search;nearTitle.textContent=t.near;notice.textContent=t.notice;streetTxt.textContent=t.street;cleanTxt.textContent=t.clean;tourTitle.textContent=t.tourTitle;tourDesc.textContent=t.tourDesc;tour.textContent=t.tour;city.options[0].text=t.city;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));cats.innerHTML='';t.cats.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i===cat?'active':'';b.onclick=()=>{cat=i;render()};cats.appendChild(b)});clearMarkers();cards.innerHTML='';const q=search.value.toLowerCase().trim();places.filter(p=>(!cat||p.cat===cat)&&(!q||[p.ar,p.de,p.en].some(n=>n.toLowerCase().includes(q)))).forEach(p=>{marker(p);const d=document.createElement('article');d.className='card';d.innerHTML='<div class="cardbody"><h3>'+p.icon+' '+p[lang]+'</h3><div class="chips"><span class="chip">📍 '+t.city+'</span><span class="chip">🕒 '+t.hours+'</span></div><p class="desc">'+p['d_'+lang]+'</p><div class="actions"><button class="go">'+t.go+'</button><button class="show">'+t.show+'</button></div></div>';d.querySelector('.show').onclick=()=>map.flyTo({center:[p.lng,p.lat],zoom:16});d.querySelector('.go').onclick=()=>window.open('https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=;'+p.lat+'%2C'+p.lng,'_blank');cards.appendChild(d)});localizeMap()}
map.on('load',render);map.on('style.load',()=>setTimeout(()=>{localizeMap();render()},250));document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});document.querySelectorAll('.mapstyles button').forEach(b=>b.onclick=()=>{map.setStyle(styleUrl(b.dataset.style));document.querySelectorAll('.mapstyles button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});search.addEventListener('input',render);nearbtn.onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(x=>map.flyTo({center:[x.coords.longitude,x.coords.latitude],zoom:14}));tour.onclick=()=>alert(lang==='ar'?'الخطوة القادمة: اختيار المدة والاهتمامات ثم إنشاء المسار.':lang==='de'?'Als Nächstes: Dauer und Interessen wählen und Route erstellen.':'Next: choose duration and interests, then create the route.');

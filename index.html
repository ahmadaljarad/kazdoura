<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b55"><title>كزدورة</title><link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial;background:#f7f3ea;color:#17231f}.top{background:#176b55;color:#fff;padding:20px 18px}.head{display:flex;justify-content:space-between}.brand{font-size:32px;font-weight:900}.tag{opacity:.9}.langs{display:flex;gap:5px;direction:ltr}.langs button{border:0;border-radius:12px;padding:9px 11px;background:#ffffff20;color:#fff;font-weight:800}.langs .active{background:#fff;color:#176b55}.view{display:none}.view.active{display:block}.hero,.cityhead{padding:22px 16px 12px}.hero h1,.cityhead h1{margin:0 0 7px}.hero p,.cityhead p{margin:0;color:#61706a}.govs,.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:12px 14px 25px}.gov,.choice{border:0;background:#fff;border-radius:20px;padding:17px 14px;text-align:start;box-shadow:0 3px 14px #0000000d}.gov strong,.choice strong{display:block;font-size:17px}.gov span,.choice small{display:block;color:#6b756f;font-size:13px;margin-top:5px}.gov.featured{background:#176b55;color:#fff}.gov.featured span{color:#d8eee6}.choice .ico{font-size:27px}.choice.disabled{opacity:.55}.back{border:0;background:#e7f1ed;color:#176b55;border-radius:12px;padding:9px 12px;font-weight:900;margin-bottom:12px}.sectiontitle{padding:18px 15px 8px}.sectiontitle h2{margin:0}.sectiontitle p{margin:4px 0;color:#68736e}.foodlist{display:flex;gap:8px;overflow:auto;padding:0 14px 20px}.food{white-space:nowrap;background:#fff;border-radius:16px;padding:12px 15px}.soon{margin:0 14px 25px;background:#fff3d9;border-radius:18px;padding:16px;color:#6d5420}.listhead{display:flex;gap:10px;align-items:center;padding:17px 14px 10px}.listhead .back{margin:0}.cards{display:grid;gap:12px;padding:0 14px 24px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 14px #0000000d}.card h3{margin:0}.card p{color:#52615b;line-height:1.5}.actions{display:flex;gap:8px}.actions button,.mode{border:0;border-radius:12px;padding:10px 12px;font-weight:800}.primary{background:#176b55;color:#fff}.secondary{background:#e8f1ee;color:#176b55}.routehead{padding:14px}.routehead h2{margin:5px 0}.modes{display:flex;gap:7px;overflow:auto;padding:0 14px 12px}.mode{background:#fff;white-space:nowrap}.mode.active{background:#176b55;color:#fff}#map{height:58vh;min-height:430px}.routeinfo{padding:14px;background:#fff}.routeinfo p{margin:5px 0;color:#65706b;font-size:14px}.maplibregl-ctrl-attrib{font-size:9px!important}@media(min-width:800px){main{max-width:900px;margin:auto}.govs,.choices{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="head"><div><div class="brand">كزدورة</div><div class="tag" id="tag"></div></div><div class="langs"><button data-l="ar" class="active">ع</button><button data-l="de">DE</button><button data-l="en">EN</button></div></div></header><main><section id="home" class="view active"><div class="hero"><h1 id="homeTitle"></h1><p id="homeDesc"></p></div><div class="govs" id="govs"></div></section><section id="governorate" class="view"><div class="cityhead"><button class="back" id="backHome"></button><h1 id="govTitle"></h1><p id="govDesc"></p></div><div class="sectiontitle"><h2 id="whatTitle"></h2></div><div class="choices" id="choices"></div><div class="sectiontitle"><h2 id="foodTitle"></h2></div><div class="foodlist" id="foods"></div><div class="soon" id="eventNote"></div></section><section id="listing" class="view"><div class="listhead"><button class="back" id="backGov"></button><h2 id="listTitle"></h2></div><div class="cards" id="cards"></div></section><section id="route" class="view"><div class="routehead"><button class="back" i let lang='ar',currentCat='',selected=null,map=null,userMarker=null,destMarker=null;const idx=()=>lang==='ar'?1:lang==='de'?2:3,descIdx=()=>lang==='ar'?4:lang==='de'?5:6;function name(g){return lang==='ar'?g[1]:lang==='de'?g[2]:g[3]}function show(id){['home','governorate','listing','route'].forEach(x=>document.getElementById(x).classList.toggle('active',x===id));scrollTo(0,0)}function home(){const t=T[lang];tag.textContent=t.tag;homeTitle.textContent=t.home;homeDesc.textContent=t.homeD;govs.innerHTML='';governors.forEach(g=>{let b=document.createElement('button');b.className='gov '+(g[0]==='damascus'?'featured':'');b.innerHTML='<strong>'+g[4]+' '+name(g)+'</strong><span>'+(g[0]==='damascus'?t.ready:t.soon)+'</span>';b.onclick=()=>g[0]==='damascus'?(renderGov(),show('governorate')):alert(t.soon);govs.appendChild(b)})}function renderGov(){const t=T[lang];govTitle.textContent='🏛️ '+(lang==='ar'?'دمشق':lang==='de'?'Damaskus':'Damascus');govDesc.textContent=t.govD;backHome.textContent='← '+t.back;whatTitle.textContent=t.what;foodTitle.textContent=t.food;eventNote.textContent=t.event;choices.innerHTML='';Object.entries(t.cats).forEach(([k,c])=>{let b=document.createElement('button');b.className='choice'+((data.places[k]||[]).length?'':' disabled');b.innerHTML='<span class="ico">'+c[0]+'</span><strong>'+c[1]+'</strong>';b.onclick=()=>openList(k,c[1]);choices.appendChild(b)});foods.innerHTML='';data.foods[lang].forEach(x=>{let d=document.createElement('div');d.className='food';d.textContent=x;foods.appendChild(d)})}function openList(k,title){if(!(data.places[k]||[]).length)return alert(T[lang].soon);currentCat=k;listTitle.textContent=title;backGov.textContent='← '+T[lang].back;cards.innerHTML='';data.places[k].forEach(p=>{let d=document.createElement('article');d.className='card';d.innerHTML='<h3>'+p[0]+' '+p[idx()]+'</h3><p>'+p[descIdx()]+'</p><div class="actions"><button class="primary">'+T[lang].route+'</button><button class="secondary">'+T[lang].details+'</button></div>';d.querySelector('.primary').onclick=()=>openRoute(p);d.querySelector('.secondary').onclick=()=>alert(p[idx()]+'\n\n'+p[descIdx()]);cards.appendChild(d)});show('listing')}function openRoute(p){selected=p;const t=T[lang];routeTitle.textContent=p[0]+' '+p[idx()];routeSub.textContent=t.from+' '+p[idx()];backList.textContent='← '+t.back;carTxt.textContent=t.car;walkTxt.textContent=t.walk;bikeTxt.textContent=t.bike;busTxt.textContent=t.bus;routeInfoTitle.textContent=t.route;routeInfoText.textContent=t.gps;show('route');setTimeout(initMap,80)}function initMap(){if(map){map.remove();map=null}map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[selected[8],selected[7]],zoom:15,attributionControl:true});destMarker=new maplibregl.Marker().setLngLat([selected[8],selected[7]]).addTo(map);if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{userMarker=new maplibregl.Marker({color:'#d79b36'}).setLngLat([pos.coords.longitude,pos.coords.latitude]).addTo(map);const b=new maplibregl.LngLatBounds();b.extend([selected[8],selected[7]]);b.extend([pos.coords.longitude,pos.coords.latitude]);map.fitBounds(b,{padding:60,maxZoom:15});routeInfoText.textContent=T[lang].from+' '+selected[idx()]},()=>{});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right')}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));home();if(governorate.classList.contains('active'))renderGov();if(listing.classList.contains('active'))openList(currentCat,T[lang].cats[currentCat][1]);if(route.classList.contains('active')&&selected)openRoute(selected)});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.mode==='transit')routeInfoText.textContent=T[lang].busSoon;else routeInfoText.textContent=T[lang].gps});backHome.onclick=()=>show('home');backGov.onclick=()=>show('governorate');backList.onclick=()=>show('listing');home();
</script></body></html>

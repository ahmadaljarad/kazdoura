<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b55"><title>كزدورة</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial;background:#f7f3ea;color:#17231f}.top{background:#176b55;color:#fff;padding:22px 18px}.head{display:flex;justify-content:space-between}.brand{font-size:34px;font-weight:900}.langs{display:flex;gap:6px;direction:ltr}.langs button{border:0;border-radius:12px;padding:10px;background:#ffffff22;color:#fff;font-weight:800}.langs .active{background:#fff;color:#176b55}.view{display:none}.view.active{display:block}.hero,.city{padding:22px 16px}.hero h1,.city h1{margin:0 0 7px}.muted{color:#68736e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:0 14px 24px}.tile{border:0;background:#fff;border-radius:20px;padding:17px 14px;text-align:start;box-shadow:0 3px 14px #0001}.tile.on{background:#176b55;color:#fff}.tile strong{display:block;font-size:17px}.tile small{display:block;margin-top:5px;opacity:.7}.back{border:0;background:#e7f1ed;color:#176b55;border-radius:12px;padding:10px 13px;font-weight:800;margin-bottom:14px}.section{padding:5px 15px 12px}.section h2{margin:0}.foods{display:flex;gap:8px;overflow:auto;padding:0 14px 22px}.food{background:#fff;padding:12px 15px;border-radius:15px;white-space:nowrap}.cards{display:grid;gap:15px;padding:0 14px 25px}.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 4px 16px #0001}.photo{width:100%;height:210px;object-fit:cover;display:block;background:#e9e5db}.body{padding:15px}.body h3{margin:0 0 7px;font-size:21px}.body p{color:#56635e;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.chip{background:#f3efe6;border-radius:10px;padding:5px 8px;font-size:12px}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:#176b55;color:#fff}.secondary{background:#e8f1ee;color:#176b55}.groupTitle{font-size:19px;font-weight:900;padding:8px 2px 0;color:#176b55}.credit{font-size:10px;color:#87918d;margin-top:8px}@media(min-width:800px){main{max-width:900px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.groupTitle{grid-column:1/-1}}</style></head><body><header class="top"><div class="head"><div><div class="brand">كزدورة</div><div id="tag"></div></div><div class="langs"><button data-l="ar" class="active">ع</button><button data-l="de">DE</button><button data-l="en">EN</button></div></div></header><main><section id="home" class="view active"><div class="hero"><h1 id="homeTitle"></h1><div class="muted" id="homeDesc"></div></div><div class="grid" id="govGrid"></div></section><section id="damascus" class="view"><div class="city"><button class="back" id="homeBack"></button><h1 id="cityTitle"></h1><div class="muted" id="cityDesc"></div></div><div class="section"><h2 id="what"></h2></div><div class="grid" id="catGrid"></div><div class="section"><h2 id="taste"></h2></div><div class="foods" id="foodBox"></div></section><section id="list" class="view"><div class="city"><button class="back" id="cityBack"></button><h1 id="listTitle"></h1></div><div class="cards" id="cards"></div></section></main><script>

const places={landmarks:[{n:['الجامع الأموي','Umayyaden-Moschee','Umayyad Mosque'],d:['من أبرز معالم دمشق القديمة.','Eine der wichtigsten Sehenswürdigkeiten der Altstadt.','One of Old Damascus’s major landmarks.'],img:imgs.mosque,lat:33.5115,lng:36.3066},{n:['قصر العظم','Azem-Palast','Azem Palace'],d:['قصر دمشقي تاريخي من القرن الثامن عشر.','Historischer Damascener Palast aus dem 18. Jahrhundert.','A historic 18th-century Damascene palace.'],img:imgs.azm,lat:33.5102,lng:36.3084},{n:['خان أسعد باشا','Khan As’ad Pasha','Khan As’ad Pasha'],d:['خان عثماني تاريخي معروف بقبابه وبنائه الحجري.','Historische osmanische Karawanserei.','A historic Ottoman caravanserai.'],img:imgs.khan,lat:33.5088,lng:36.3096}],restaurants:[{n:['مطعم نارنج','Naranj Restaurant','Naranj Restaurant'],d:['مأكولات سورية وشرق أوسطية.','Syrische und orientalische Küche.','Syrian and Middle Eastern cuisine.'],lat:33.5105,lng:36.3135},{n:['بيت جبري','Beit Jabri','Beit Jabri'],d:['بيت دمشقي تقليدي ومطعم.','Traditionelles Damascener Haus und Restaurant.','Traditional Damascene house and restaurant.'],lat:33.5108,lng:36.3115}],cafes:[{n:['بكداش','Bakdash','Bakdash'],d:['بوظة دمشقية شهيرة في سوق الحميدية.','Berühmtes Damascener Eis im Souq al-Hamidiyah.','Famous Damascene ice cream in Al-Hamidiyah Souq.'],img:imgs.bakdash,lat:33.5113,lng:36.3023},{n:['مقهى النوفرة','Al Nawforaa Café','Al Nawforaa Café'],d:['مقهى دمشقي تقليدي قرب الجامع الأموي.','Traditionelles Café nahe der Umayyaden-Moschee.','Traditional café near the Umayyad Mosque.'],lat:33.512,lng:36.3069}],markets:[{type:'historic',n:['سوق الحميدية','Souq al-Hamidiyah','Al-Hamidiyah Souq'],d:['أشهر أسواق دمشق التاريخية المغطاة، يمتد نحو 600 متر باتجاه الجامع الأموي ويضم مئات المحال والحرف التقليدية.','Berühmter überdachter Souq der Altstadt, rund 600 Meter lang und voller traditioneller Geschäfte.','Damascus’s famous covered historic souq, about 600 metres long with hundreds of shops and traditional crafts.'],img:imgs.souq,lat:33.5111,lng:36.303},{type:'historic',n:['سوق البزورية','Souq al-Buzuriyah','Al-Buzuriyah Souq'],d:['سوق تاريخي في قلب دمشق القديمة معروف بالتوابل والأعشاب والعطارة والحلويات والصابون التقليدي.','Historischer Souq der Altstadt, bekannt für Gewürze, Kräuter, Süßwaren und traditionelle Seifen.','A historic Old City souq known for spices, herbs, sweets and traditional soaps.'],lat:33.5087,lng:36.3095},{type:'historic',n:['سوق مدحت باشا','Souq Midhat Pasha','Midhat Pasha Souq'],d:['سوق تاريخي يمتد على محور الشارع المستقيم، ويشتهر بالأقمشة والملابس والحرف والعطور والتوابل.','Historischer Souq entlang der Geraden Straße mit Stoffen, Kleidung, Handwerk, Düften und Gewürzen.','A historic souq along Straight Street, with textiles, clothing, crafts, perfumes and spices.'],lat:33.5092,lng:36.3115},{type:'historic',n:['سوق الحرير','Souq al-Harir','Al-Harir Souq'],d:['من الأسواق الدمشقية التاريخية المرتبطة بتجارة الأقمشة والخياطة، ويشكل صلة بين عدد من أسواق المدينة القديمة.','Historischer Damascener Textil- und Schneider-Souq, der mehrere Altstadtmärkte verbindet.','A historic Damascene textile and tailoring souq connecting several Old City markets.'],lat:33.5098,lng:36.3068},{type:'historic',n:['سوق باب سريجة','Souq Bab Sreijeh','Bab Sreijeh Market'],d:['سوق شعبي قديم معروف بالمواد الغذائية والخضار والمنتجات اليومية والأجواء الدمشقية المحلية.','Traditioneller Markt für Lebensmittel, Gemüse und Dinge des täglichen Bedarfs.','A traditional market known for food, produce, daily goods and local Damascene atmosphere.'],lat:33.5072,lng:36.2988},{type:'modern',n:['شام سيتي سنتر','Cham City Center','Cham City Center'],d:['مركز تسوق معروف في كفرسوسة يضم متاجر ومطاعم ومقاهي وخيارات ترفيهية.','Bekanntes Einkaufszentrum in Kafr Sousa mit Geschäften, Gastronomie und Freizeitangeboten.','A well-known Kafr Sousa shopping centre with stores, dining and entertainment options.'],lat:33.5005,lng:36.2865},{type:'modern',n:['داماسكينو مول','Damasquino Mall','Damasquino Mall'],d:['مركز تجاري في كفرسوسة قريب من شام سيتي سنتر const food={ar:['🍦 بوظة دمشقية','🥙 فتة','🍆 مكدوس','🍬 حلويات شامية'],de:['🍦 Damascener Eis','🥙 Fatteh','🍆 Makdous','🍬 Damascener Süßes'],en:['🍦 Damascene ice cream','🥙 Fatteh','🍆 Makdous','🍬 Damascene sweets']};let lang='ar',current='';function li(){return lang==='ar'?0:lang==='de'?1:2}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}function renderHome(){let t=tr[lang];tag.textContent=t.tag;homeTitle.textContent=t.home;homeDesc.textContent=t.desc;govGrid.innerHTML='';govs.forEach((g,i)=>{let b=document.createElement('button');b.className='tile'+(i===0?' on':'');b.innerHTML='<strong>'+g[3]+' '+g[li()]+'</strong><small>'+(i===0?t.available:t.soon)+'</small>';b.onclick=()=>i===0?(renderCity(),show('damascus')):alert(t.soon);govGrid.appendChild(b)})}function renderCity(){let t=tr[lang];homeBack.textContent='← '+t.back;cityTitle.textContent='🏛️ '+t.city;cityDesc.textContent=t.cityDesc;what.textContent=t.what;taste.textContent=t.taste;catGrid.innerHTML='';Object.keys(t.cats).forEach(k=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<strong>'+t.cats[k]+'</strong><small>'+(places[k].length?t.available:t.soon)+'</small>';b.onclick=()=>openList(k);catGrid.appendChild(b)});foodBox.innerHTML='';food[lang].forEach(x=>{let d=document.createElement('div');d.className='food';d.textContent=x;foodBox.appendChild(d)})}function addCard(p,k){let a=document.createElement('article');a.className='card';let chip=p.type?(p.type==='historic'?tr[lang].historic:tr[lang].modern):(k==='restaurants'||k==='cafes'?tr[lang].food:tr[lang].historic);a.innerHTML=(p.img?'<img class="photo" src="'+p.img+'" alt="'+p.n[li()]+'" loading="lazy" onerror="this.style.display=\'none\'">':'')+'<div class="body"><h3>'+p.n[li()]+'</h3><div class="chips"><span class="chip">📍 '+(p.type==='modern'?tr[lang].city:tr[lang].old)+'</span><span class="chip">✨ '+chip+'</span></div><p>'+p.d[li()]+'</p><div class="actions"><button class="primary">'+tr[lang].route+'</button><button class="secondary">'+tr[lang].details+'</button></div>'+(p.img?'<div class="credit">📷 Wikimedia Commons</div>':'')+'</div>';a.querySelector('.primary').onclick=()=>window.open('https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=17/'+p.lat+'/'+p.lng,'_blank');a.querySelector('.secondary').onclick=()=>alert(p.n[li()]+'\n\n'+p.d[li()]);cards.appendChild(a)}function openList(k){if(!places[k].length)return alert(tr[lang].soon);current=k;listTitle.textContent=tr[lang].cats[k];cityBack.textContent='← '+tr[lang].back;cards.innerHTML='';if(k==='markets'){let h=document.createElement('div');h.className='groupTitle';h.textContent=tr[lang].historicMarkets;cards.appendChild(h);places[k].filter(p=>p.type==='historic').forEach(p=>addCard(p,k));let m=document.createElement('div');m.className='groupTitle';m.textContent=tr[lang].modernMalls;cards.appendChild(m);places[k].filter(p=>p.type==='modern').forEach(p=>addCard(p,k))}else places[k].forEach(p=>addCard(p,k));show('list')}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x===b));renderHome();if(damascus.classList.contains('active'))renderCity();if(list.classList.contains('active')&&current)openList(current)});homeBack.onclick=()=>show('home');cityBack.onclick=()=>show('damascus');renderHome();
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b55"><title>كزدورة | اكتشف سوريا</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial;background:#f6f3ec;color:#17231f}.top{padding:18px 18px 16px;background:#176b55;color:#fff}.headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.identity{min-width:0}.brand{font-size:30px;font-weight:900;line-height:1}.tag{opacity:.9;margin-top:8px;font-size:16px}.langs{display:flex;gap:5px;direction:ltr;flex-shrink:0}.langs button,.mapstyles button{border:0;border-radius:12px;padding:8px 10px;font-weight:700}.langs button{background:#ffffff20;color:#fff;min-width:42px}.langs button.active{background:#fff;color:#176b55}.search{padding:14px 14px 8px}.search input{width:100%;padding:14px 16px;border:1px solid #ddd5c7;border-radius:16px;font-size:16px}.cats{display:flex;gap:8px;overflow:auto;padding:4px 14px 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cats button{white-space:nowrap;border:1px solid #d7d0c2;background:#fff;padding:10px 12px;border-radius:18px}.cats button.active{background:#176b55;color:#fff;border-color:#176b55}.mapwrap{position:relative}#map{height:48vh;min-height:350px}.mapstyles{position:absolute;z-index:800;top:12px;right:12px;background:#fff;padding:5px;border-radius:15px;box-shadow:0 3px 14px #0003;display:flex;gap:4px;direction:ltr}.mapstyles button{background:#f1eee7;font-size:12px}.mapstyles button.active{background:#176b55;color:#fff}.pin{width:38px;height:38px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:#176b55;border:3px solid #fff;box-shadow:0 2px 8px #0004;display:grid;place-items:center}.pin span{transform:rotate(45deg);font-size:18px}.maplabel{background:#fff;border:0!important;box-shadow:0 2px 8px #0002;border-radius:8px!important;color:#173d32;font-weight:800;padding:3px 7px!important;white-space:nowrap}.maplabel:before{display:none}.panel{padding:14px 14px 85px}.panel h2{margin:0 0 10px}.cards{display:grid;gap:10px}.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 18px #0000000d}.card h3{margin:0 0 5px}.meta{font-size:13px;color:#68726d}.actions{display:flex;gap:8px;margin-top:11px}.actions button,.tour{border:0;border-radius:13px;padding:10px 12px;font-weight:700}.go{background:#176b55;color:#fff}.loc{background:#e9f2ef;color:#176b55}.tour{position:fixed;z-index:900;bottom:18px;left:50%;transform:translateX(-50%);background:#d79b36;color:#1e1b13;padding:13px 20px;box-shadow:0 5px 18px #0003;white-space:nowrap}.leaflet-control-attribution{font-size:9px}.notice{font-size:12px;color:#68726d;margin-top:8px}@media(max-width:390px){.brand{font-size:27px}.langs button{min-width:37px;padding:7px}.tag{font-size:14px}}</style></head><body><header class="top"><div class="headrow"><div class="identity"><div class="brand">كزدورة</div><div class="tag" id="tag"></div></div><div class="langs"><button data-l="ar" class="active">ع</button><button data-l="de">DE</button><button data-l="en">EN</button></div></div></header><main><div class="search"><input id="search"></div><div class="cats" id="cats"></div><div class="mapwrap"><div id="map"></div><div class="mapstyles"><button class="active" data-map="street">🗺️ <span id="streetTxt"></span></button><button data-map="topo">⛰️ <span id="topoTxt"></span></button></div></div><section class="panel"><h2 id="nearTitle"></h2><div class="cards" id="cards"></div><div class="notice" id="notice"></div></section></main><button class="tour" id="tour"></button><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const T={ar:{tag:'اكتشف سوريا بطريقتك',search:'ابحث عن مكان أو مدينة…',near:'أماكن مقترحة في دمشق',tour:'✨ اعمللي كزدورة',go:'الاتجاهات',loc:'موقعي',street:'طرق',topo:'تضاريس',city:'دمشق',notice:'نسخة تجريبية. معلومات الأماكن ستُراجع من مصادر موثوقة.',cats:['الكل','معالم','مطاعم','كافيهات','أطفال','حدائق','فنادق','أسواق']},de:{tag:'Entdecke Syrien auf deine Art',search:'Ort oder Stadt suchen…',near:'Empfohlene Orte in Damaskus',tour:'✨ Plane meine Kazdoura',go:'Route',loc:'Mein Standort',street:'Straßen',topo:'Gelände',city:'Damaskus',notice:'Testversion. Ortsinformationen werden aus verlässlichen Quellen geprüft.',cats:['Alle','Sehenswürdigkeiten','Restaurants','Cafés','Kinder','Parks','Hotels','Märkte']},en:{tag:'Discover Syria your way',search:'Search for a place or city…',near:'Recommended places in Damascus',tour:'✨ Plan my Kazdoura',go:'Directions',loc:'My location',street:'Streets',topo:'Terrain',city:'Damascus',notice:'Test version. Place information will be verified using reliable sources.',cats:['All','Landmarks','Restaurants','Cafés','Kids','Parks','Hotels','Markets']}};
const places=[{cat:1,icon:'🏛️',lat:33.5115,lng:36.3066,ar:'الجامع الأموي',de:'Umayyaden-Moschee',en:'Umayyad Mosque'},{cat:7,icon:'🛍️',lat:33.5111,lng:36.3030,ar:'سوق الحميدية',de:'Souq al-Hamidiyah',en:'Al-Hamidiyah Souq'},{cat:1,icon:'🏛️',lat:33.5102,lng:36.3084,ar:'قصر العظم',de:'Azem-Palast',en:'Azem Palace'},{cat:5,icon:'🌳',lat:33.515,lng:36.292,ar:'حديقة تشرين',de:'Tishreen-Park',en:'Tishreen Park'}];
let lang='ar',cat=0;const map=L.map('map').setView([33.513,36.305],14);const maps={street:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}),topo:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'Map data © OpenStreetMap contributors · SRTM | Map style © OpenTopoMap'})};maps.street.addTo(map);let current=maps.street,layer=L.layerGroup().addTo(map);
function icon(e){return L.divIcon({className:'',html:'<div class="pin"><span>'+e+'</span></div>',iconSize:[38,38],iconAnchor:[19,38]})}
function render(){const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';tag.textContent=t.tag;search.placeholder=t.search;nearTitle.textContent=t.near;tour.textContent=t.tour;notice.textContent=t.notice;streetTxt.textContent=t.street;topoTxt.textContent=t.topo;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));cats.innerHTML='';t.cats.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i===cat?'active':'';b.onclick=()=>{cat=i;render()};cats.appendChild(b)});layer.clearLayers();cards.innerHTML='';places.filter(p=>!cat||p.cat===cat).forEach(p=>{L.marker([p.lat,p.lng],{icon:icon(p.icon)}).addTo(layer).bindTooltip(p[lang],{permanent:true,direction:'top',offset:[0,-40],className:'maplabel'}).bindPopup('<b>'+p[lang]+'</b>');const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+p.icon+' '+p[lang]+'</h3><div class="meta">'+t.city+'</div><div class="actions"><button class="go">'+t.go+'</button><button class="loc">'+t.loc+'</button></div>';d.querySelector('.go').onclick=()=>window.open('https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=;'+p.lat+'%2C'+p.lng,'_blank');d.querySelector('.loc').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(x=>{L.marker([x.coords.latitude,x.coords.longitude]).addTo(layer).bindPopup(t.loc).openPopup();map.setView([x.coords.latitude,x.coords.longitude],15)});cards.appendChild(d)})}
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});document.querySelectorAll('.mapstyles button').forEach(b=>b.onclick=()=>{map.removeLayer(current);current=maps[b.dataset.map];current.addTo(map);document.querySelectorAll('.mapstyles button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});search.addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q)return;const p=places.find(x=>[x.ar,x.de,x.en].some(n=>n.toLowerCase().includes(q)));if(p)map.setView([p.lat,p.lng],16)});tour.onclick=()=>alert(lang==='ar'?'قريباً: اختر وقتك واهتماماتك وسنبني لك كزدورة كاملة.':lang==='de'?'Demnächst: Wähle Zeit und Interessen und wir planen deine Tour.':'Coming soon: choose your time and interests and we will build your tour.');render();
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b55"><title>كزدورة</title><link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial;background:#f7f3ea;color:#17231f}.top{background:#176b55;color:#fff;padding:20px 18px}.head{display:flex;justify-content:space-between}.brand{font-size:32px;font-weight:900}.tag{opacity:.9}.langs{display:flex;gap:5px;direction:ltr}.langs button{border:0;border-radius:12px;padding:9px 11px;background:#ffffff20;color:#fff;font-weight:800}.langs .active{background:#fff;color:#176b55}.view{display:none}.view.active{display:block}.hero,.cityhead{padding:22px 16px 12px}.hero h1,.cityhead h1{margin:0 0 7px}.hero p,.cityhead p{margin:0;color:#61706a}.govs,.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:12px 14px 25px}.gov,.choice{border:0;background:#fff;border-radius:20px;padding:17px 14px;text-align:start;box-shadow:0 3px 14px #0000000d}.gov strong,.choice strong{display:block;font-size:17px}.gov span,.choice small{display:block;color:#6b756f;font-size:13px;margin-top:5px}.gov.featured{background:#176b55;color:#fff}.gov.featured span{color:#d8eee6}.choice .ico{font-size:27px}.choice.disabled{opacity:.55}.back{border:0;background:#e7f1ed;color:#176b55;border-radius:12px;padding:9px 12px;font-weight:900;margin-bottom:12px}.sectiontitle{padding:18px 15px 8px}.sectiontitle h2{margin:0}.foodlist{display:flex;gap:8px;overflow:auto;padding:0 14px 20px}.food{white-space:nowrap;background:#fff;border-radius:16px;padding:12px 15px}.soon{margin:0 14px 25px;background:#fff3d9;border-radius:18px;padding:16px;color:#6d5420}.listhead{display:flex;gap:10px;align-items:center;padding:17px 14px 10px}.listhead .back{margin:0}.cards{display:grid;gap:12px;padding:0 14px 24px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 3px 14px #0000000d}.card h3{margin:0}.card p{color:#52615b;line-height:1.5}.actions{display:flex;gap:8px}.actions button,.mode{border:0;border-radius:12px;padding:10px 12px;font-weight:800}.primary{background:#176b55;color:#fff}.secondary{background:#e8f1ee;color:#176b55}.routehead{padding:14px}.routehead h2{margin:5px 0}.modes{display:flex;gap:7px;overflow:auto;padding:0 14px 12px}.mode{background:#fff;white-space:nowrap}.mode.active{background:#176b55;color:#fff}#map{height:58vh;min-height:430px}.routeinfo{padding:14px;background:#fff}.routeinfo p{margin:5px 0;color:#65706b;font-size:14px}@media(min-width:800px){main{max-width:900px;margin:auto}.govs,.choices{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="head"><div><div class="brand">كزدورة</div><div class="tag" id="tag"></div></div><div class="langs"><button data-l="ar" class="active">ع</button><button data-l="de">DE</button><button data-l="en">EN</button></div></div></header><main><section id="home" class="view active"><div class="hero"><h1 id="homeTitle"></h1><p id="homeDesc"></p></div><div class="govs" id="govs"></div></section><section id="governorate" class="view"><div class="cityhead"><button class="back" id="backHome"></button><h1 id="govTitle"></h1><p id="govDesc"></p></div><div class="sectiontitle"><h2 id="whatTitle"></h2></div><div class="choices" id="choices"></div><div class="sectiontitle"><h2 id="foodTitle"></h2></div><div class="foodlist" id="foods"></div><div class="soon" id="eventNote"></div></section><section id="listing" class="view"><div class="listhead"><button class="back" id="backGov"></button><h2 id="listTitle"></h2></div><div class="cards" id="cards"></div></section><section id="route" class="view"><div class="routehead"><button class="back" id="backList"></button><h2 id="routeTitle"></h2><div id="routeSub"></div></div><div class="modes"><button class="mode active">🚗 <span id="carTxt"></span></button><button class="mode">🚶 <span id="walkTxt"></span></button><button class="mode">🚲 <span id="bikeTxt"></span></button><button class="mode">🚌 <span id="busTxt"></span></button></div><div id="map"></div><div class="routeinfo"><strong id="routeInfoTitle"></strong><p id="routeInfoText"></p></div></section></main><script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script>

nts:['🎉','Events'],family:['👨‍👩‍👧','Family & kids'],nature:['🌳','Nature & parks'],markets:['🛍️','Markets'],hotels:['🏨','Hotels']}}};

const places={landmarks:[['🕌','الجامع الأموي','Umayyaden-Moschee','Umayyad Mosque','من أبرز معالم دمشق القديمة.','Eines der wichtigsten Bauwerke der Altstadt.','One of Old Damascus major landmarks.',33.5115,36.3066],['🏛️','قصر العظم','Azem-Palast','Azem Palace','قصر دمشقي تاريخي من القرن الثامن عشر.','Historischer Damascener Palast.','Historic Damascene palace.',33.5102,36.3084]],restaurants:[['🍽️','مطعم نارنج','Naranj Restaurant','Naranj Restaurant','مأكولات شامية وشرق أوسطية.','Syrische und orientalische Küche.','Syrian and Middle Eastern cuisine.',33.5105,36.3135],['🍽️','بيت جبري','Beit Jabri','Beit Jabri','بيت دمشقي تقليدي ومطعم.','Traditionelles Damascener Haus.','Traditional Damascene house and restaurant.',33.5108,36.3115]],cafes:[['☕','مقهى النوفرة','Al Nawforaa Café','Al Nawforaa Café','مقهى دمشقي معروف.','Bekanntes Damascener Café.','Well-known Damascene café.',33.512,36.3069]],events:[],family:[],nature:[],markets:[],hotels:[]};
const foods={ar:['🍦 بوظة دمشقية','🥙 فتة','🍆 مكدوس','🍬 حلويات شامية'],de:['🍦 Damascener Eis','🥙 Fatteh','🍆 Makdous','🍬 Damascener Süßes'],en:['🍦 Damascene ice cream','🥙 Fatteh','🍆 Makdous','🍬 Damascene sweets']};let lang='ar',currentCat='',selected=null,map=null;const ni=()=>lang==='ar'?1:lang==='de'?2:3,di=()=>lang==='ar'?4:lang==='de'?5:6;function gname(g){return lang==='ar'?g[1]:lang==='de'?g[2]:g[3]}function show(id){['home','governorate','listing','route'].forEach(x=>document.getElementById(x).classList.toggle('active',x===id));window.scrollTo(0,0)}function renderHome(){let t=T[lang];document.getElementById('tag').textContent=t.tag;document.getElementById('homeTitle').textContent=t.home;document.getElementById('homeDesc').textContent=t.homeD;let box=document.getElementById('govs');box.innerHTML='';governors.forEach(g=>{let b=document.createElement('button');b.className='gov '+(g[0]==='damascus'?'featured':'');b.innerHTML='<strong>'+g[4]+' '+gname(g)+'</strong><span>'+(g[0]==='damascus'?t.ready:t.soon)+'</span>';b.onclick=()=>{if(g[0]==='damascus'){renderGov();show('governorate')}else alert(t.soon)};box.appendChild(b)})}function renderGov(){let t=T[lang];document.getElementById('govTitle').textContent='🏛️ '+(lang==='ar'?'دمشق':lang==='de'?'Damaskus':'Damascus');document.getElementById('govDesc').textContent=t.govD;document.getElementById('backHome').textContent='← '+t.back;document.getElementById('whatTitle').textContent=t.what;document.getElementById('foodTitle').textContent=t.food;document.getElementById('eventNote').textContent=t.event;let c=document.getElementById('choices');c.innerHTML='';Object.entries(t.cats).forEach(([k,v])=>{let b=document.createElement('button');b.className='choice'+(places[k].length?'':' disabled');b.innerHTML='<span class="ico">'+v[0]+'</span><strong>'+v[1]+'</strong>';b.onclick=()=>openList(k,v[1]);c.appendChild(b)});let f=document.getElementById('foods');f.innerHTML='';foods[lang].forEach(x=>{let d=document.createElement('div');d.className='food';d.textContent=x;f.appendChild(d)})}function openList(k,title){if(!places[k].length){alert(T[lang].soon);return}currentCat=k;document.getElementById('listTitle').textContent=title;document.getElementById('backGov').textContent='← '+T[lang].back;let box=document.getElementById('cards');box.innerHTML='';places[k].forEach(p=>{let d=document.createElement('article');d.className='card';d.innerHTML='<h3>'+p[0]+' '+p[ni()]+'</h3><p>'+p[di()]+'</p><div class="actions"><button class="primary">'+T[lang].route+'</button><button class="secondary">'+T[lang].details+'</button></div>';d.querySelector('.primary').onclick=()=>openRoute(p);d.querySelector('.secondary').onclick=()=>alert(p[ni()]+' - '+p[di()]);box.appendChild(d)});show('listing')}function openRoute(p){selected=p;let t=T[lang];document.getElementById('routeTitle').textContent=p[0]+' '+p[ni()];document.getElementById('routeSub').textContent=t.from+' '+p[ni()];document.getElementById('backList').textContent='← '+t.back;document.getElementById('carTxt').textContent=t.car;document.getElementById('walkTxt').textContent=t.walk;document.getElementById('bikeTxt').textContent=t.bike;document.getElementById('busTxt').textContent=t.bus;document.getElementById('routeInfoTitle').textContent=t.route;document.getElementById('routeInfoText').textContent=t.gps;show('route');setTimeout(initMap,100)}function initMap(){if(map){map.remove();map=null}map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[selected[8],selected[7]],zoom:15});new maplibregl.Marker().setLngLat([selected[8],selected[7]]).addTo(map);map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');if(navigator.geolocation)navigator.geolocation.getCurrentPosition(pos=>{let u=[pos.coords.longitude,pos.coords.latitude];new maplibregl.Marker({color:'#d79b36'}).setLngLat(u).addTo(map);let b=new maplibregl.LngLatBounds();b.extend([selected[8],selected[7]]).extend(u);map.fitBounds(b,{padding:60,maxZoom:15})})}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x.dataset.l===lang));renderHome();if(document.getElementById('governorate').classList.contains('active'))renderGov();if(document.getElementById('listing').classList.contains('active'))openList(currentCat,T[lang].cats[currentCat][1]);if(document.getElementById('route').classList.contains('active')&&selected)openRoute(selected)});document.getElementById('backHome').onclick=()=>show('home');document.getElementById('backGov').onclick=()=>show('governorate');document.getElementById('backList').onclick=()=>show('listing');renderHome();
</script></body></html>

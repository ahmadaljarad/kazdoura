const landmarks=[L('الجامع الأموي','Umayyaden-Moschee','Umayyad Mosque','من أهم معالم دمشق القديمة ومن أبرز آثار العصر الأموي.','Eines der bedeutendsten Monumente der Altstadt und der Umayyadenzeit.','One of Old Damascus’s most important monuments and a major Umayyad landmark.',33.5115,36.3066,I.mosque),L('قصر العظم','Azem-Palast','Azem Palace','قصر دمشقي تاريخي من القرن الثامن عشر.','Historischer Damascener Palast aus dem 18. Jahrhundert.','A historic 18th-century Damascene palace.',33.5102,36.3084,I.azm),L('خان أسعد باشا','Khan As’ad Pasha','Khan As’ad Pasha','خان عثماني تاريخي بارز في دمشق القديمة.','Bedeutende osmanische Karawanserei in der Altstadt.','A major historic Ottoman caravanserai in the Old City.',33.5088,36.3096,I.khan),L('قلعة دمشق','Zitadelle von Damaskus','Citadel of Damascus','قلعة تاريخية تعود بنيتها الحالية أساساً إلى العصر الأيوبي وتقع عند الطرف الغربي للمدينة القديمة.','Historische Zitadelle, deren heutige Anlage vor allem aus ayyubidischer Zeit stammt.','A historic citadel whose present form is mainly Ayyubid, on the western edge of the Old City.',33.5117,36.3019,I.citadel),L('المتحف الوطني بدمشق','Nationalmuseum Damaskus','National Museum of Damascus','أحد أهم متاحف سوريا ويضم مجموعات تغطي مراحل تاريخية متعددة.','Eines der wichtigsten Museen Syriens mit Sammlungen aus mehreren Epochen.','One of Syria’s major museums, with collections spanning multiple historical periods.',33.5126,36.2904,I.museum),L('الشارع المستقيم','Gerade Straße','Straight Street','محور تاريخي من التخطيط الروماني لدمشق وما زال جزءاً أساسياً من نسيج المدينة القديمة.','Historische Achse des römischen Stadtplans und bis heute Teil der Altstadt.','A historic axis of Roman Damascus that remains central to the Old City.',33.5095,36.315,I.straight),L('باب شرقي','Bab Sharqi','Bab Sharqi','أقدم أبواب دمشق الباقية ويرتبط بالطرف الشرقي للشارع المستقيم.','Eines der ältesten erhaltenen Stadttore am östlichen Ende der Geraden Straße.','One of Damascus’s oldest surviving gates at the ea er Altstadt.','A historic Christian site in the Christian quarter of Old Damascus.',33.5091,36.316),L('ضريح صلاح الدين الأيوبي','Saladin-Mausoleum','Mausoleum of Saladin','ضريح تاريخي بجوار الجامع الأموي مرتبط بصلاح الدين الأيوبي.','Historisches Mausoleum neben der Umayyaden-Moschee, verbunden mit Saladin.','A historic mausoleum beside the Umayyad Mosque associated with Saladin.',33.5121,36.3061)];
const places={landmarks,restaurants:[L('مطعم نارنج','Naranj Restaurant','Naranj Restaurant','مطعم يقدم مأكولات سورية وشرق أوسطية.','Restaurant mit syrischer und orientalischer Küche.','Restaurant serving Syrian and Middle Eastern cuisine.',33.5105,36.3135),L('بيت جبري','Beit Jabri','Beit Jabri','بيت دمشقي تقليدي ومطعم في المدينة القديمة.','Traditionelles Damascener Haus und Restaurant.','Traditional Damascene house and restaurant.',33.5108,36.3115)],cafes:[L('بكداش','Bakdash','Bakdash','من أشهر أماكن البوظة الدمشقية في سوق الحميدية.','Bekannte Adresse für Damascener Eis.','Famous for Damascene ice cream.',33.5113,36.3023,I.bak),L('مقهى النوفرة','Al-Nawfara Café','Al-Nawfara Café','مقهى دمشقي تقليدي قرب الجامع الأموي.','Traditionelles Café nahe der Umayyaden-Moschee.','Traditional café near the Umayyad Mosque.',33.512,36.3069,I.naw)],markets:[L('سوق الحميدية','Souq al-Hamidiyah','Al-Hamidiyah Souq','من أشهر الأسواق التاريخية المغطاة في دمشق.','Einer der bekanntesten historischen Basare von Damaskus.','One of Damascus’s best-known historic covered markets.',33.5111,36.303,I.ham),L('سوق البزورية','Souq al-Buzuriyah','Al-Buzuriyah Souq','سوق تاريخي معروف بالتوابل والأعشاب والحلويات والصابون.','Historischer Souq für Gewürze, Kräuter, Süßwaren und Seife.','Historic souq known for spices, herbs, sweets and soap.',33.5094,36.3063,I.buz),L('سوق مدحت باشا','Souq Midhat Pasha','Midhat Pasha Souq','سوق تاريخي على جزء من محور الشارع المستقيم.','Historischer Markt entlang der Geraden Straße.','Historic market along part of Straight Street.',33.5094,36.3108),L('سوق الحرير','Souq al-Harir','Al-Harir Souq','سوق قديم ارتبط تاريخياً بالأقمشة والمنسوجات.','Alter Souq, historisch mit Textilien verbunden.','Old souq historically associated with textiles.',33.511,36.3075),L('سوق باب سريجة','Souq Bab Srija','Bab Srija Market','سوق شعبي تاريخي للمواد الغذائية والمنتجات المحلية.','Traditioneller Markt für Lebensmittel und lokale Produkte.','Traditional market for food and local goods.',33.5064,36.2988)],parks:[L('حديقة تشرين','Tishreen-Park','Tishreen Park','من أكبر الحدائق العامة في دمشق ومناسبة للمشي والعائلات.','Großer öffentlicher Park zum Spazieren und für Familien.','Large public park suited to walking and family outings.',33.5156,36.2681,I.tish),L('حديقة السبكي','Al-Sabki-Park','Al-Sabki Park','حديقة عامة فيها مساحات خضراء ومنطقة لألعاب الأطفال.','Öffentlicher Park mit Grünflächen und Kinderspielbereich.','Public park with green spaces and a children’s play area.',33.5192,36.2883,I.sab)],family:[],events:[],hotels:[]};
const food={ar:['🍦 بوظة دمشقية','🥙 فتة','🍆 مكدوس','🍬 حلويات شامية'],de:['🍦 Damascener Eis','🥙 Fatteh','🍆 Makdous','🍬 Damascener Süßes'],en:['🍦 Damascene ice cream','🥙 Fatteh','🍆 Makdous','🍬 Damascene sweets']};let lang='ar',current='';const $=id=>document.getElementById(id),li=()=>lang==='ar'?0:lang==='de'?1:2;function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function home(){let t=T[lang];$('tag').textContent=t.tag;$('homeTitle').textContent=t.home;$('homeDesc').textContent=t.desc;$('govGrid').innerHTML='';govs.forEach((g,i)=>{let b=document.createElement('button');b.className='tile'+(i?'':' on');b.innerHTML='<strong>'+g[3]+' '+g[li()]+'</strong><small>'+(i?t.soon:t.ok)+'</small>';b.onclick=()=>i?alert(t.soon):(city(),show('damascus'));$('govGrid').appendChild(b)})}function city(){let t=T[lang];$('homeBack').textContent='← '+t.back;$('cityTitle').textContent='🏛️ '+t.city;$('cityDesc').textContent=t.cityDesc;$('what').textContent=t.what;$('taste').textContent=t.taste;$('catGrid').innerHTML='';Object.keys(t.cats).forEach(k=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<strong>'+t.cats[k]+'</strong><small>'+(places[k].length?t.ok:t.soon)+'</small>';b.onclick=()=>openList(k);$('catGrid').appendChild(b)});$('foodBox').innerHTML=food[lang].map(x=>'<div class="food">'+x+'</div>').join('')}function thumb(x){try{let u=new URL(x);u.searchParams.set('width',520);return u}catch{return x}}function gallery(p){if(!p.imgs?.length)return '<div class="noimg">📷 '+T[lang].noPhoto+'</div>';return '<div class="gallery">'+p.imgs.map((x,i)=>'<img '+(i?'data-src':'src')+'="'+thumb(x)+'" loading="lazy" decoding="async">').join('')+'</div>'}function card(p,k){let a=document.createElement('article');a.className='card';a.innerHTML=gallery(p)+'<div class="body"><h3>'+p.n[li()]+'</h3><div class="chips"><span class="chip">📍 '+T[lang].city+'</span><span class="chip">✨ '+(k==='parks'?T[lang].park:k==='restaurants'||k==='cafes'?T[lang].food:T[lang].place)+'</span>'+(p.imgs?.length>1?'<span class="chip">📷 '+p.imgs.length+'</span>':'')+'</div><p>'+p.d[li()]+'</p><div class="actions"><button class="primary">'+T[lang].route+'</button><button class="secondary">'+T[lang].details+'</button></div>'+(p.imgs?'<div class="credit">📷 Wikimedia Commons · '+T[lang].photos+'</div>':'')+'</div>';let g=a.querySelector('.gallery'),load=()=>g?.querySelectorAll('[data-src]').forEach(i=>{i.src=i.dataset.src;i.removeAttribute('data-src')});g?.addEventListener('pointerdown',load,{once:true});g?.addEventListener('touchstart',load,{once:true,passive:true});a.querySelector('.primary').onclick=()=>window.open('https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=17/'+p.lat+'/'+p.lng,'_blank');a.querySelector('.secondary').onclick=()=>alert(p.n[li()]+'\n\n'+p.d[li()]);$('cards').appendChild(a)}function openList(k){if(!places[k].length)return alert(T[lang].soon);current=k;$('listTitle').textContent=T[lang].cats[k];$('cityBack').textContent='← '+T[lang].back;$('cards').innerHTML='';places[k].forEach(p=>card(p,k));show('list')}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x===b));home();if($('damascus').classList.contains('active'))city();if($('list').classList.contains('active')&&current)openList(current)});$('homeBack').onclick=()=>show('home');$('cityBack').onclick=()=>show('damascus');home();

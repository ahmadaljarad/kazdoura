const food={ar:['🍦 بوظة دمشقية','🥙 فتة','🍆 مكدوس','🍬 حلويات شامية'],de:['🍦 Damascener Eis','🥙 Fatteh','🍆 Makdous','🍬 Damascener Süßes'],en:['🍦 Damascene ice cream','🥙 Fatteh','🍆 Makdous','🍬 Damascene sweets']};let lang='ar',current='';const $=id=>document.getElementById(id),li=()=>lang==='ar'?0:lang==='de'?1:2;function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function home(){let t=T[lang];$('tag').textContent=t.tag;$('homeTitle').textContent=t.home;$('homeDesc').textContent=t.desc;$('govGrid').innerHTML='';govs.forEach((g,i)=>{let b=document.createElement('button');b.className='tile'+(i?'':' on');b.innerHTML='<strong>'+g[3]+' '+g[li()]+'</strong><small>'+(i?t.soon:t.ok)+'</small>';b.onclick=()=>i?alert(t.soon):(city(),show('damascus'));$('govGrid').appendChild(b)})}function city(){let t=T[lang];$('homeBack').textContent='← '+t.back;$('cityTitle').textContent='🏛️ '+t.city;$('cityDesc').textContent=t.cityDesc;$('what').textContent=t.what;$('taste').textContent=t.taste;$('catGrid').innerHTML='';Object.keys(t.cats).forEach(k=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<strong>'+t.cats[k]+'</strong><small>'+(places[k].length?t.ok:t.soon)+'</small>';b.onclick=()=>openList(k);$('catGrid').appendChild(b)});$('foodBox').innerHTML=food[lang].map(x=>'<div class="food">'+x+'</div>').join('')}function thumb(x){try{let u=new URL(x);u.searchParams.set('width',520);return u}catch{return x}}function gallery(p){if(!p.imgs?.length)return '<div class="noimg">📷 '+T[lang].noPhoto+'</div>';return '<div class="gallery">'+p.imgs.map((x,i)=>'<img '+(i?'data-src':'src')+'="'+thumb(x)+'" loading="lazy" decoding="async">').join('')+'</div>'}function card(p,k){let a=document.createElement('article');a.className='card';a.innerHTML=gallery(p)+'<div class="body"><h3>'+p.n[li()]+'</h3><div class="chips"><span class="chip">📍 '+T[lang].city+'</span><span class="chip">✨ '+(k==='parks'?T[lang].park:k==='restaurants'||k==='cafes'?T[lang].food:T[lang].place)+'</span>'+(p.imgs?.length>1?'<span class="chip">📷 '+p.imgs.length+'</span>':'')+'</div><p>'+p.d[li()]+'</p><div class="actions"><button class="primary">'+T[lang].route+'</button><button class="secondary">'+T[lang].details+'</button></div>'+(p.imgs?'<div class="credit">📷 Wikimedia Commons · '+T[lang].photos+'</div>':'')+'</div>';let g=a.querySelector('.gallery'),load=()=>g?.querySelectorAll('[data-src]').forEach(i=>{i.src=i.dataset.src;i.removeAttribute('data-src')});g?.addEventListener('pointerdown',load,{once:true});g?.addEventListener('touchstart',load,{once:true,passive:true});a.querySelector('.primary').onclick=()=>window.open('https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=17/'+p.lat+'/'+p.lng,'_blank');a.querySelector('.secondary').onclick=()=>alert(p.n[li()]+'\n\n'+p.d[li()]);$('cards').appendChild(a)}function openList(k){if(!places[k].length)return alert(T[lang].soon);current=k;$('listTitle').textContent=T[lang].cats[k]+' · '+places[k].length;$('cityBack').textContent='← '+T[lang].back;$('cards').innerHTML='';places[k].forEach(p=>card(p,k));show('list')}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x===b));home();if($('damascus').classList.contains('active'))city();if($('list').classList.contains('active')&&current)openList(current)});$('homeBack').onclick=()=>show('home');$('cityBack').onclick=()=>show('damascus');home();
</script></body></html>

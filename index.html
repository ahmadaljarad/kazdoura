<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b55"><title>كزدورة</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial;background:#f7f3ea;color:#17231f}.top{background:#176b55;color:#fff;padding:22px 18px}.head{display:flex;justify-content:space-between;gap:12px}.brand{font-size:34px;font-weight:900}.langs{display:flex;gap:6px;direction:ltr}.langs button{border:0;border-radius:12px;padding:10px;background:#ffffff22;color:#fff;font-weight:800}.langs .active{background:#fff;color:#176b55}.view{display:none}.view.active{display:block}.hero,.city{padding:22px 16px}.muted{color:#68736e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:0 14px 24px}.tile{border:0;background:#fff;border-radius:20px;padding:17px 14px;text-align:start;box-shadow:0 3px 14px #0001}.tile.on{background:#176b55;color:#fff}.tile strong{display:block;font-size:17px}.tile small{display:block;margin-top:5px;opacity:.7}.back{border:0;background:#e7f1ed;color:#176b55;border-radius:12px;padding:10px 13px;font-weight:800;margin-bottom:14px}.section{padding:5px 15px 12px}.foods{display:flex;gap:8px;overflow:auto;padding:0 14px 22px}.food{background:#fff;padding:12px 15px;border-radius:15px;white-space:nowrap}.cards{display:grid;gap:15px;padding:0 14px 25px}.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 4px 16px #0001}.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;direction:ltr;background:#e9e5db;scrollbar-width:none}.gallery img{width:100%;height:220px;object-fit:cover;display:block;flex:0 0 100%;scroll-snap-align:center}.body{padding:15px}.body h3{margin:0 0 7px;font-size:21px}.body p{color:#56635e;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.chip{background:#f3efe6;border-radius:10px;padding:5px 8px;font-size:12px}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:#176b55;color:#fff}.secondary{background:#e8f1ee;color:#176b55}.credit{font-size:10px;color:#87918d;margin-top:8px}.noimg{height:110px;display:grid;place-items:center;background:#ece8df;color:#7c8580;font-size:13px}@media(min-width:800px){main{max-width:900px;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="head"><div><div class="brand">كزدورة</div><div id="tag"></div></div><div class="langs"><button data-l="ar" class="active">ع</button><button data-l="de">DE</button><button data-l="en">EN</button></div></div></header><main><section id="home" class="view active"><div class="hero"><h1 id="homeTitle"></h1><div class="muted" id="homeDesc"></div></div><div class="grid" id="govGrid"></div></section><section id="damascus" class="view"><div class="city"><button class="back" id="homeBack"></button><h1 id="cityTitle"></h1><div class="muted" id="cityDesc"></div></div><div class="section"><h2 id="what"></h2></div><div class="grid" id="catGrid"></div><div class="section"><h2 id="taste"></h2></div><div class="foods" id="foodBox"></div></section><section id="list" class="view"><div class="city"><button class="back" id="cityBack"></button><h1 id="listTitle"></h1></div><div class="cards" id="cards"></div></section></main><script src="landmarks-extra.js"></script><script>
const T={ar:{tag:'اكتشف سوريا بطريقتك',home:'وين بدك تكزدُر؟',desc:'اختار المحافظة وبعدها اكتشف شو فيها.',ok:'متاحة الآن',soon:'قيد التجهيز',back:'رجوع',city:'دمشق',cityDesc:'اختار شو حابب تعمل بدمشق.',what:'شو بدك تعمل؟',taste:'شو لازم تذوق؟',route:'الاتجاهات',details:'التفاصيل',place:'معلم سياحي',photos:'اسحب لمشاهدة الصور',noPhoto:'الصور قيد الإضافة',cats:{landmarks:'🏛️ معالم وآثار'}},de:{tag:'Entdecke Syrien auf deine Art',home:'Wohin möchtest du?',desc:'Wähle ein Gouvernement und entdecke es.',ok:'Verfügbar',soon:'In Vorbereitung',back:'Zurück',city:'Damaskus',cityDesc:'Was möchtest du in Damaskus machen?',what:'Was möchtest du machen?',taste:'Was solltest du probieren?',route:'Route',details:'Details',place:'Sehenswürdigkeit',photos:'Wischen für weitere Fotos',noPhoto:'Fotos werden ergänzt',cats:{landmarks:'🏛️ Sehenswürdigkeiten'}},en:{tag:'Discover Syria your way',home:'Where do you want to explore?',desc:'Choose a governorate and discover it.',ok:'Available',soon:'In preparation',back:'Back',city:'Damascus',cityDesc:'What would you like to do in Damascus?',what:'What do you want to do?',taste:'What should you taste?',route:'Directions',details:'Details',place:'Landmark',photos:'Swipe for more photos',noPhoto:'Photos are being added',cats:{landmarks:'🏛️ Landmarks'}}};
const base=[{n:['الجامع الأموي','Umayyaden-Moschee','Umayyad Mosque'],d:['من أهم معالم دمشق القديمة.','Eines der wichtigsten Monumente der Altstadt.','One of the most important monuments of Old Damascus.'],lat:33.5115,lng:36.3066,imgs:['https://commons.wikimedia.org/wiki/Special:Redirect/file/Umayyad%20Mosque%20-%20courtyard.JPG']},{n:['قصر العظم','Azem-Palast','Azem Palace'],d:['قصر دمشقي تاريخي من القرن الثامن عشر.','Historischer Damascener Palast des 18. Jahrhunderts.','Historic 18th-century Damascene palace.'],lat:33.5102,lng:36.3084,imgs:['https://commons.wikimedia.org/wiki/Special:Redirect/file/Azem%20Palace.jpg']}];
const landmarks=base.concat(window.KAZDOURA_EXTRA_LANDMARKS||[]);const places={landmarks};const govs=[['دمشق','Damaskus','Damascus','🏛️'],['ريف دمشق','Rif Damaskus','Rif Dimashq','⛰️'],['حلب','Aleppo','Aleppo','🏰'],['حمص','Homs','Homs','🌿'],['حماة','Hama','Hama','💧'],['اللاذقية','Latakia','Latakia','🌊'],['طرطوس','Tartus','Tartus','⚓'],['إدلب','Idlib','Idlib','🌳'],['درعا','Daraa','Daraa','🌾'],['السويداء','As-Suwaida','As-Suwayda','⛰️'],['القنيطرة','Quneitra','Quneitra','🌄'],['دير الزور','Deir ez-Zor','Deir ez-Zor','🌴'],['الرقة','Raqqa','Raqqa','🏺'],['الحسكة','Al-Hasaka','Al-Hasakah','🌾']];let lang='ar',current='';const $=id=>document.getElementById(id),li=()=>lang==='ar'?0:lang==='de'?1:2;function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function home(){let t=T[lang];$('tag').textContent=t.tag;$('homeTitle').textContent=t.home;$('homeDesc').textContent=t.desc;$('govGrid').innerHTML='';govs.forEach((g,i)=>{let b=document.createElement('button');b.className='tile'+(i?'':' on');b.innerHTML='<strong>'+g[3]+' '+g[li()]+'</strong><small>'+(i?t.soon:t.ok)+'</small>';b.onclick=()=>i?alert(t.soon):(city(),show('damascus'));$('govGrid').appendChild(b)})}function city(){let t=T[lang];$('homeBack').textContent='← '+t.back;$('cityTitle').textContent='🏛️ '+t.city;$('cityDesc').textContent=t.cityDesc;$('what').textContent=t.what;$('taste').textContent='';$('foodBox').innerHTML='';$('catGrid').innerHTML='';let b=document.createElement('button');b.className='tile';b.innerHTML='<strong>'+t.cats.landmarks+'</strong><small>'+landmarks.length+' · '+t.ok+'</small>';b.onclick=()=>openList('landmarks');$('catGrid').appendChild(b)}function gallery(p){if(!p.imgs?.length)return '<div class="noimg">📷 '+T[lang].noPhoto+'</div>';return '<div class="gallery">'+p.imgs.map(x=>'<img src="'+x+'" loading="lazy" decoding="async">').join('')+'</div>'}function card(p){let a=document.createElement('article');a.className='card';a.innerHTML=gallery(p)+'<div class="body"><h3>'+p.n[li()]+'</h3><p>'+p.d[li()]+'</p><div class="actions"><button class="primary">'+T[lang].route+'</button><button class="secondary">'+T[lang].details+'</button></div></div>';a.querySelector('.primary').onclick=()=>window.open('https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=17/'+p.lat+'/'+p.lng,'_blank');a.querySelector('.secondary').onclick=()=>alert(p.n[li()]+'\n\n'+p.d[li()]);$('cards').appendChild(a)}function openList(k){current=k;$('listTitle').textContent=T[lang].cats[k]+' · '+places[k].length;$('cityBack').textContent='← '+T[lang].back;$('cards').innerHTML='';places[k].forEach(card);show('list')}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x===b));home();if($('damascus').classList.contains('active'))city();if($('list').classList.contains('active')&&current)openList(current)});$('homeBack').onclick=()=>show('home');$('cityBack').onclick=()=>show('damascus');home();
</script></body></html>

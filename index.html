const P={landmarks:[{n:['الجامع الأموي','Umayyaden-Moschee','Umayyad Mosque'],d:['من أبرز معالم دمشق القديمة وأشهر نماذج العمارة الأموية.','Eine der wichtigsten Sehenswürdigkeiten der Altstadt.','One of Old Damascus’s major landmarks.'],imgs:imgs.mosque,lat:33.5115,lng:36.3066},{n:['قصر العظم','Azem-Palast','Azem Palace'],d:['قصر دمشقي تاريخي من القرن الثامن عشر بساحاته وعماراته الدمشقية.','Historischer Damascener Palast aus dem 18. Jahrhundert.','A historic 18th-century Damascene palace.'],imgs:imgs.azm,lat:33.5102,lng:36.3084},{n:['خان أسعد باشا','Khan As’ad Pasha','Khan As’ad Pasha'],d:['خان عثماني تاريخي في قلب دمشق القديمة يتميز بالقباب والحجر الأبلق.','Historische osmanische Karawanserei in der Altstadt.','A historic Ottoman caravanserai in the Old City.'],imgs:imgs.khan,lat:33.5088,lng:36.3096}],restaurants:[{n:['مطعم نارنج','Naranj Restaurant','Naranj Restaurant'],d:['مأكولات سورية وشرق أوسطية.','Syrische und orientalische Küche.','Syrian and Middle Eastern cuisine.'],lat:33.5105,lng:36.3135},{n:['بيت جبري','Beit Jabri','Beit Jabri'],d:['بيت دمشقي تقليدي ومطعم في المدينة القديمة.','Traditionelles Damascener Haus und Restaurant.','Traditional Damascene house and restaurant.'],lat:33.5108,lng:36.3115}],cafes:[{n:['بكداش','Bakdash','Bakdash'],d:['من أشهر أماكن البوظة الدمشقية في سوق الحميدية.','Bekannte Adresse für Damascener Eis.','A famous place for Damascene ice cream.'],imgs:imgs.bak,lat:33.5113,lng:36.3023},{n:['مقهى النوفرة','Al Nawforaa Café','Al Nawforaa Café'],d:['مقهى دمشقي تقليدي قرب الجامع الأموي.','Traditionelles Café nahe der Umayyaden-Moschee.','Traditional café near the Umayyad Mosque.'],lat:33.512,lng:36.3069}],markets:[{type:'historic',n:['سوق الحميدية','Souq al-Hamidiyah','Al-Hamidiyah Souq'],d:['أحد أشهر الأسواق التاريخية المغطاة في دمشق.','Einer der bekanntesten historischen Basare von Damaskus.','One of Damascus’s best-known historic covered markets.'],imgs:imgs.ham,lat:33.5111,lng:36.303},{type:'historic',n:['سوق البزورية','Souq al-Buzuri const food={ar:['🍦 بوظة دمشقية','🥙 فتة','🍆 مكدوس','🍬 حلويات شامية'],de:['🍦 Damascener Eis','🥙 Fatteh','🍆 Makdous','🍬 Damascener Süßes'],en:['🍦 Damascene ice cream','🥙 Fatteh','🍆 Makdous','🍬 Damascene sweets']};let lang='ar',current='';function li(){return lang==='ar'?0:lang==='de'?1:2}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}function renderHome(){let t=tr[lang];tag.textContent=t.tag;homeTitle.textContent=t.home;homeDesc.textContent=t.desc;govGrid.innerHTML='';govs.forEach((g,i)=>{let b=document.createElement('button');b.className='tile'+(i===0?' on':'');b.innerHTML='<strong>'+g[3]+' '+g[li()]+'</strong><small>'+(i===0?t.available:t.soon)+'</small>';b.onclick=()=>i===0?(renderCity(),show('damascus')):alert(t.soon);govGrid.appendChild(b)})}function renderCity(){let t=tr[lang];homeBack.textContent='← '+t.back;cityTitle.textContent='🏛️ '+t.city;cityDesc.textContent=t.cityDesc;what.textContent=t.what;taste.textContent=t.taste;catGrid.innerHTML='';Object.keys(t.cats).forEach(k=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<strong>'+t.cats[k]+'</strong><small>'+(P[k].length?t.available:t.soon)+'</small>';b.onclick=()=>openList(k);catGrid.appendChild(b)});foodBox.innerHTML='';food[lang].forEach(x=>{let d=document.createElement('div');d.className='food';d.textContent=x;foodBox.appendChild(d)})}function gallery(p){if(!p.imgs||!p.imgs.length)return '<div class="noimg">📷 '+tr[lang].noPhoto+'</div>';return '<div class="gallery">'+p.imgs.map((x,i)=>'<img src="'+x+'" alt="'+p.n[li()]+' '+(i+1)+'" loading="lazy" onerror="this.remove()">').join('')+'</div>'}function addCard(p,k){let a=document.createElement('article');a.className='card';let label=k==='markets'?(p.type==='modern'?tr[lang].modern:tr[lang].historic):(k==='restaurants'||k==='cafes'?tr[lang].food:tr[lang].place);a.innerHTML=gallery(p)+'<div class="body"><h3>'+p.n[li()]+'</h3><div class="chips"><span class="chip">📍 '+tr[lang].city+'</span><span class="chip">✨ '+label+'</span>'+(p.imgs&&p.imgs.length>1?'<span class="chip">📷 '+p.imgs.length+'</span>':'')+'</div><p>'+p.d[li()]+'</p><div class="actions"><button class="primary">'+tr[lang].route+'</button><button class="secondary">'+tr[lang].details+'</button></div>'+(p.imgs?'<div class="credit">📷 Wikimedia Commons · '+tr[lang].photos+'</div>':'')+'</div>';a.querySelector('.primary').onclick=()=>window.open('https://www.openstreetmap.org/?mlat='+p.lat+'&mlon='+p.lng+'#map=17/'+p.lat+'/'+p.lng,'_blank');a.querySelector('.secondary').onclick=()=>alert(p.n[li()]+'\n\n'+p.d[li()]);cards.appendChild(a)}function openList(k){if(!P[k].length)return alert(tr[lang].soon);current=k;listTitle.textContent=tr[lang].cats[k];cityBack.textContent='← '+tr[lang].back;cards.innerHTML='';if(k==='markets'){let g=document.createElement('div');g.className='group';g.textContent=tr[lang].historicMarkets;cards.appendChild(g);P[k].filter(p=>p.type==='historic').forEach(p=>addCard(p,k));g=document.createElement('div');g.className='group';g.textContent=tr[lang].modernMalls;cards.appendChild(g);P[k].filter(p=>p.type==='modern').forEach(p=>addCard(p,k))}else P[k].forEach(p=>addCard(p,k));show('list')}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.langs button').forEach(x=>x.classList.toggle('active',x===b));renderHome();if(damascus.classList.contains('active'))renderCity();if(list.classList.contains('active')&&current)openList(current)});homeBack.onclick=()=>show('home');cityBack.onclick=()=>show('damascus');renderHome();
